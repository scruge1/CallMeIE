<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallMeIE Admin</title>
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="alternate icon" href="/favicon.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 16px; }
  h1 { font-size: 1.3rem; font-weight: 700; color: #22d3ee; margin-bottom: 4px; }
  .subtitle { font-size: 0.85rem; color: #64748b; margin-bottom: 24px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { padding: 8px 18px; border-radius: 6px; border: 1px solid #334155;
         background: transparent; color: #94a3b8; cursor: pointer; font-size: 0.9rem; }
  .tab.active { background: #22d3ee; color: #0f172a; border-color: #22d3ee; font-weight: 600; }
  .badge { display: inline-block; background: #ef4444; color: #fff;
           border-radius: 99px; font-size: 0.7rem; padding: 1px 6px; margin-left: 4px; vertical-align: middle; }
  .section { display: none; }
  .section.active { display: block; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px;
          padding: 16px; margin-bottom: 12px; }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .biz-name { font-size: 1rem; font-weight: 700; }
  .biz-type { font-size: 0.75rem; background: #0e7490; color: #fff;
              padding: 2px 8px; border-radius: 99px; }
  .meta { font-size: 0.82rem; color: #94a3b8; margin-bottom: 10px; line-height: 1.6; }
  .meta strong { color: #cbd5e1; }
  .detail-row { font-size: 0.78rem; color: #64748b; margin-bottom: 4px; }
  .detail-row strong { color: #94a3b8; }
  details summary { font-size: 0.8rem; color: #475569; cursor: pointer;
                    margin-bottom: 8px; user-select: none; }
  details[open] summary { color: #22d3ee; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer;
         font-size: 0.85rem; font-weight: 600; transition: opacity 0.15s; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-provision { background: #22d3ee; color: #0f172a; }
  .btn-reject { background: transparent; border: 1px solid #ef4444; color: #ef4444; }
  .btn-sms { background: transparent; border: 1px solid #334155; color: #94a3b8; font-size: 0.8rem; }
  .status-badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
  .status-pending { background: #92400e; color: #fde68a; }
  .status-provisioned { background: #065f46; color: #6ee7b7; }
  .status-rejected { background: #3f3f46; color: #a1a1aa; }
  .status-active { background: #065f46; color: #6ee7b7; }
  .empty { text-align: center; color: #475569; padding: 40px 20px; font-size: 0.9rem; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b;
           border: 1px solid #334155; border-radius: 8px; padding: 12px 16px;
           font-size: 0.85rem; max-width: 280px; z-index: 999;
           transition: opacity 0.3s; }
  .toast.success { border-color: #22d3ee; color: #22d3ee; }
  .toast.error { border-color: #ef4444; color: #ef4444; }
  .token-screen { max-width: 360px; margin: 80px auto; text-align: center; }
  .token-screen input { width: 100%; padding: 12px; background: #1e293b;
                        border: 1px solid #334155; border-radius: 8px; color: #e2e8f0;
                        font-size: 1rem; margin: 16px 0; text-align: center; }
  .token-screen .btn { width: 100%; padding: 12px; background: #22d3ee; color: #0f172a; font-size: 1rem; }
  #main { display: none; }
  .assist-id { font-size: 0.72rem; font-family: monospace; color: #475569;
               background: #0f172a; padding: 2px 6px; border-radius: 4px; }
  .health-ok     { color: #4ade80; }
  .health-quiet  { color: #fbbf24; }
  .health-errors { color: #ef4444; }
  .health-dead   { color: #475569; }
  .stat-row { display: flex; gap: 16px; font-size: 0.78rem; color: #64748b; margin-top: 6px; }
  .stat-row span strong { color: #94a3b8; }
  /* Call log */
  .call-group { background: #1e293b; border: 1px solid #334155; border-radius: 10px;
                margin-bottom: 12px; overflow: hidden; }
  .call-group-header { padding: 10px 14px; display: flex; justify-content: space-between;
                       align-items: center; border-bottom: 1px solid #334155;
                       font-size: 0.82rem; }
  .call-id-label { font-family: monospace; color: #475569; font-size: 0.72rem; }
  .call-event { display: flex; gap: 10px; padding: 6px 14px;
                border-bottom: 1px solid #1a2535; font-size: 0.78rem; align-items: flex-start; }
  .call-event:last-child { border-bottom: none; }
  .ev-time { color: #475569; min-width: 58px; font-family: monospace; padding-top: 1px; }
  .ev-type { min-width: 120px; font-weight: 600; padding-top: 1px; }
  .ev-call-ended    { color: #94a3b8; }
  .ev-lead-captured { color: #22d3ee; }
  .ev-demo-complete { color: #a78bfa; }
  .ev-booking       { color: #4ade80; }
  .ev-avail-check   { color: #fbbf24; }
  .ev-lead-error    { color: #ef4444; }
  .ev-summary { color: #cbd5e1; flex: 1; }
  .ev-detail { font-family: monospace; font-size: 0.7rem; color: #475569;
               background: #0f172a; padding: 4px 8px; border-radius: 4px;
               margin-top: 3px; white-space: pre-wrap; }
  .log-controls { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
  .log-controls label { font-size: 0.82rem; color: #64748b; }
  .refresh-indicator { font-size: 0.75rem; color: #475569; margin-left: auto; }
</style>
</head>
<body>

<div id="tokenScreen" class="token-screen">
  <h1>CallMeIE Admin</h1>
  <p style="color:#64748b;margin-top:8px;font-size:0.9rem;">Enter your admin token to continue</p>
  <input type="password" id="tokenInput" placeholder="Admin token" autocomplete="off">
  <button class="btn" onclick="login()">Enter</button>
</div>

<div id="main">
  <h1>CallMeIE Admin</h1>
  <div class="subtitle" id="subtitle">Loading...</div>
  <div id="backupStatus" style="font-size:0.8rem;color:#94a3b8;margin-bottom:18px;"></div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('pending')">
      Queue <span id="pendingBadge" class="badge" style="display:none"></span>
    </button>
    <button class="tab" onclick="switchTab('clients')">Active Clients</button>
    <button class="tab" onclick="switchTab('calls')">
      Call Log <span id="liveDot" style="display:inline-block;width:7px;height:7px;background:#22d3ee;border-radius:50%;margin-left:4px;vertical-align:middle"></span>
    </button>
    <button class="tab" onclick="switchTab('discovery')">
      Discovery <span id="discoveryBadge" class="badge" style="display:none"></span>
    </button>
    <button class="tab" onclick="switchTab('leads')">
      Leads <span id="leadsBadge" class="badge" style="display:none"></span>
    </button>
    <button class="tab" onclick="switchTab('ads')">
      Ads <span id="adsLiveDot" style="display:none;width:7px;height:7px;background:#4ade80;border-radius:50%;margin-left:4px;vertical-align:middle"></span>
    </button>
  </div>

  <div id="pendingSection" class="section active"></div>
  <div id="clientsSection" class="section"></div>
  <div id="callsSection" class="section">
    <div class="card" style="margin-bottom:12px;background:#0a0e1a;border:1px solid #22d3ee44">
      <div class="card-header" style="padding-bottom:8px">
        <strong style="color:#22d3ee">Send setup-link to live caller</strong>
        <span style="color:#94a3b8;font-size:0.72rem;margin-left:8px">caller picks "lock in today" on demo line → Adam fires this → SMS lands on caller's mobile mid-call</span>
      </div>
      <div style="display:grid;grid-template-columns:2fr 1.6fr 1.4fr auto;gap:10px;align-items:end;padding:10px 0">
        <div>
          <label style="display:block;font-size:0.72rem;color:#94a3b8;margin-bottom:4px">Phone (E.164)</label>
          <input id="sslPhone" type="text" placeholder="+353871234567"
            style="width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #334155;padding:8px;border-radius:4px;font-family:monospace">
        </div>
        <div>
          <label style="display:block;font-size:0.72rem;color:#94a3b8;margin-bottom:4px">Tier</label>
          <select id="sslTier"
            style="width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #334155;padding:8px;border-radius:4px">
            <option value="professional">Professional €249/mo</option>
            <option value="growth">Growth €397/mo</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:0.72rem;color:#94a3b8;margin-bottom:4px">
            <input type="checkbox" id="sslSetup" checked style="margin-right:4px"> Bundle €297 setup
          </label>
        </div>
        <button class="btn btn-provision" onclick="sendSetupLink()" style="height:38px">Send</button>
      </div>
      <div id="sslResult" style="font-size:0.78rem;color:#94a3b8;min-height:1.2em;padding-top:4px"></div>
    </div>
    <div id="callsEventLog"></div>
  </div>
  <div id="discoverySection" class="section"></div>
  <div id="leadsSection" class="section"></div>
  <div id="adsSection" class="section"></div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
let TOKEN = '';
const BASE = window.location.origin;

function login() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  TOKEN = t;
  sessionStorage.setItem('admin_token', t);
  document.getElementById('tokenScreen').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  loadAll();
}

// Check sessionStorage or URL param on load
window.onload = () => {
  const params = new URLSearchParams(window.location.search);
  const t = params.get('token') || sessionStorage.getItem('admin_token');
  if (t) {
    TOKEN = t;
    document.getElementById('tokenScreen').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    loadAll();
  }
  document.getElementById('tokenInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
};

let callsAutoRefresh = null;

function switchTab(tab) {
  const tabs = ['pending', 'clients', 'calls', 'discovery', 'leads', 'ads'];
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', tabs[i] === tab);
  });
  document.getElementById('pendingSection').classList.toggle('active', tab === 'pending');
  document.getElementById('clientsSection').classList.toggle('active', tab === 'clients');
  document.getElementById('callsSection').classList.toggle('active', tab === 'calls');
  document.getElementById('discoverySection').classList.toggle('active', tab === 'discovery');
  document.getElementById('leadsSection').classList.toggle('active', tab === 'leads');
  document.getElementById('adsSection').classList.toggle('active', tab === 'ads');

  if (tab === 'calls') {
    loadEvents();
    if (!callsAutoRefresh) {
      callsAutoRefresh = setInterval(loadEvents, 5000);
    }
  } else {
    clearInterval(callsAutoRefresh);
    callsAutoRefresh = null;
  }
  if (tab === 'discovery') {
    loadDiscovery();
  }
  if (tab === 'leads') {
    loadLeads();
  }
  if (tab === 'ads') {
    loadAds();
  }
}

async function loadAll() {
  await Promise.all([loadSubmissions(), loadClients(), loadBackupStatus(), loadDiscoveryBadge(), loadLeadsBadge()]);
}

// ── P2-4 unified leads pipeline ──────────────────────────────────────────

let _leadsState = { channel: '', status: 'new,contacted,qualified', q: '', cursor: null };

async function loadLeadsBadge() {
  try {
    const r = await fetch(`${BASE}/admin/api/leads?token=${TOKEN}&status=new&limit=1`);
    if (!r.ok) return;
    const d = await r.json();
    const n = d.aggregates && d.aggregates.by_status && d.aggregates.by_status.new;
    const el = document.getElementById('leadsBadge');
    if (el && n) { el.textContent = n; el.style.display = 'inline-block'; }
  } catch (e) {}
}

async function loadLeads(append) {
  const sec = document.getElementById('leadsSection');
  if (!append) sec.innerHTML = '<div class="empty">Loading…</div>';
  const params = new URLSearchParams({ token: TOKEN, days: 30, limit: 50 });
  if (_leadsState.channel) params.set('channel', _leadsState.channel);
  if (_leadsState.status) params.set('status', _leadsState.status);
  if (_leadsState.q) params.set('q', _leadsState.q);
  if (append && _leadsState.cursor) params.set('cursor', _leadsState.cursor);
  try {
    const r = await fetch(`${BASE}/admin/api/leads?${params.toString()}`);
    if (!r.ok) { sec.innerHTML = '<div class="empty">Error loading leads</div>'; return; }
    const d = await r.json();
    if (d.error === 'table_not_ready') {
      sec.innerHTML = '<div class="empty">unified_leads table not deployed yet — alembic 0003 pending. Run <code>alembic upgrade head</code> on Coolify.</div>';
      return;
    }
    const agg = d.aggregates || {};
    const bs = agg.by_status || {};
    const tw = agg.this_week || {};
    const kpis = `
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
        <div class="card"><div style="font-size:0.75rem;color:#94a3b8;text-transform:uppercase">New (this week)</div><div style="font-size:1.6rem;font-weight:700;color:#22d3ee">${tw.new||0}</div></div>
        <div class="card"><div style="font-size:0.75rem;color:#94a3b8;text-transform:uppercase">Contacted</div><div style="font-size:1.6rem;font-weight:700">${bs.contacted||0}</div></div>
        <div class="card"><div style="font-size:0.75rem;color:#94a3b8;text-transform:uppercase">Qualified</div><div style="font-size:1.6rem;font-weight:700;color:#10b981">${bs.qualified||0}</div></div>
        <div class="card"><div style="font-size:0.75rem;color:#94a3b8;text-transform:uppercase">Closed Won</div><div style="font-size:1.6rem;font-weight:700;color:#10b981">${bs.closed_won||0}</div></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <select onchange="_leadsState.channel=this.value;_leadsState.cursor=null;loadLeads()" style="background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:6px 10px">
          <option value="">All channels</option>
          <option value="discovery"${_leadsState.channel==='discovery'?' selected':''}>Discovery</option>
          <option value="onboard"${_leadsState.channel==='onboard'?' selected':''}>Onboard</option>
          <option value="owl_form"${_leadsState.channel==='owl_form'?' selected':''}>Owl form</option>
          <option value="audit"${_leadsState.channel==='audit'?' selected':''}>Audit (€99)</option>
          <option value="email"${_leadsState.channel==='email'?' selected':''}>Email</option>
          <option value="whatsapp"${_leadsState.channel==='whatsapp'?' selected':''}>WhatsApp</option>
          <option value="manual"${_leadsState.channel==='manual'?' selected':''}>Manual</option>
        </select>
        <select onchange="_leadsState.status=this.value;_leadsState.cursor=null;loadLeads()" style="background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:6px 10px">
          <option value="">All statuses</option>
          <option value="new,contacted,qualified"${_leadsState.status==='new,contacted,qualified'?' selected':''}>Active</option>
          <option value="new"${_leadsState.status==='new'?' selected':''}>New</option>
          <option value="contacted"${_leadsState.status==='contacted'?' selected':''}>Contacted</option>
          <option value="qualified"${_leadsState.status==='qualified'?' selected':''}>Qualified</option>
          <option value="closed_won"${_leadsState.status==='closed_won'?' selected':''}>Closed won</option>
          <option value="closed_lost"${_leadsState.status==='closed_lost'?' selected':''}>Closed lost</option>
          <option value="spam"${_leadsState.status==='spam'?' selected':''}>Spam</option>
        </select>
        <input type="search" placeholder="Search email/name/business…" value="${esc(_leadsState.q)}" oninput="_leadsState.q=this.value;clearTimeout(window._leadsDebounce);window._leadsDebounce=setTimeout(()=>{_leadsState.cursor=null;loadLeads()},300)" style="flex:1;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:6px 10px">
        <span style="margin-left:auto;color:#94a3b8;font-size:0.85rem;align-self:center">${agg.total||0} total</span>
      </div>`;
    const rowsHtml = (d.leads || []).map(l => {
      const chipColor = { discovery:'#0e7490', onboard:'#7c3aed', owl_form:'#15803d', audit:'#b91c1c', email:'#92400e', whatsapp:'#10b981', manual:'#475569' }[l.primary_channel] || '#475569';
      return `
        <div class="card">
          <div class="card-header">
            <div>
              <span style="background:${chipColor};color:#fff;padding:2px 8px;border-radius:99px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em">${esc(l.primary_channel)}</span>
              ${(l.channels||[]).filter(c=>c!==l.primary_channel).map(c=>`<span style="background:#334155;color:#cbd5e1;padding:2px 6px;border-radius:99px;font-size:0.65rem;margin-left:4px">${esc(c)}</span>`).join('')}
              ${l.priority>=2?`<span style="background:#dc2626;color:#fff;padding:2px 6px;border-radius:99px;font-size:0.65rem;margin-left:4px">P${l.priority}</span>`:''}
            </div>
            <select onchange="updateLeadStatus('${l.id}', this.value, '${l.status}')" style="background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:4px;padding:4px 8px;font-size:0.85rem">
              ${['new','contacted','qualified','closed_won','closed_lost','spam'].map(s=>`<option value="${s}"${l.status===s?' selected':''}>${s}</option>`).join('')}
            </select>
          </div>
          <div style="font-size:0.95rem;margin-bottom:6px"><strong>${esc(l.business_name||l.contact_name||'(no name)')}</strong></div>
          <div style="font-size:0.85rem;color:#94a3b8">
            ${l.contact_email?`<span>${esc(l.contact_email)}</span>`:''}
            ${l.contact_phone?` · <span>${esc(l.contact_phone)}</span>`:''}
            ${l.contact_name && l.business_name?` · ${esc(l.contact_name)}`:''}
          </div>
          <div style="font-size:0.75rem;color:#64748b;margin-top:6px">
            Last touch: ${esc(l.last_touch_at||'')} · Created: ${esc(l.created_at||'')}
            ${l.notes?`<div style="margin-top:4px;color:#cbd5e1;font-style:italic">${esc(l.notes)}</div>`:''}
          </div>
        </div>`;
    }).join('');
    const more = d.next_cursor ? `<button onclick="_leadsState.cursor='${d.next_cursor}';loadLeads(true)" style="background:#22d3ee;color:#0f172a;border:0;padding:8px 16px;border-radius:6px;cursor:pointer;margin-top:12px">Load more</button>` : '';
    if (append) {
      sec.insertAdjacentHTML('beforeend', rowsHtml + more);
    } else {
      sec.innerHTML = kpis + (rowsHtml || '<div class="empty">No leads in this filter.</div>') + more;
    }
  } catch (e) {
    sec.innerHTML = `<div class="empty">Error loading leads: ${esc(String(e))}</div>`;
  }
}

async function updateLeadStatus(leadId, newStatus, oldStatus) {
  try {
    const r = await fetch(`${BASE}/admin/api/leads/${leadId}?token=${TOKEN}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus })
    });
    if (!r.ok) {
      const err = await r.json().catch(()=>({}));
      toast(`Status change rejected: ${err.detail||r.statusText}`, true);
      // Reload to revert UI
      loadLeads();
      return;
    }
    toast(`Status: ${oldStatus} → ${newStatus}`);
    loadLeadsBadge();
  } catch (e) {
    toast(`Error: ${e}`, true);
    loadLeads();
  }
}

// ── Discovery quiz submissions (P2-2) ────────────────────────────────────────

async function loadDiscoveryBadge() {
  // Cheap badge render — count rows so the operator can see "12 new
  // discovery submissions this week" without opening the tab.
  try {
    const r = await fetch(`${BASE}/admin/api/discovery-submissions?token=${TOKEN}`);
    if (!r.ok) return;
    const rows = await r.json();
    const badge = document.getElementById('discoveryBadge');
    if (!badge) return;
    if (rows.length > 0) {
      badge.textContent = rows.length;
      badge.style.display = 'inline-block';
    }
  } catch (e) { /* noop — badge is decorative */ }
}

async function loadDiscovery() {
  const section = document.getElementById('discoverySection');
  section.innerHTML = '<div style="color:#94a3b8">Loading…</div>';
  try {
    const r = await fetch(`${BASE}/admin/api/discovery-submissions?token=${TOKEN}`);
    if (!r.ok) {
      section.innerHTML = `<div style="color:#fca5a5">Error: ${r.status}</div>`;
      return;
    }
    const rows = await r.json();
    if (!rows.length) {
      section.innerHTML = '<div style="color:#94a3b8">No discovery quiz submissions yet.</div>';
      return;
    }

    // Top-line aggregates.
    const byProduct = {};
    const byPage = {};
    const byUrgency = {};
    let withContact = 0;
    rows.forEach(r => {
      byProduct[r.recommended_product || 'unknown'] = (byProduct[r.recommended_product || 'unknown'] || 0) + 1;
      byPage[r.page_context || 'unknown'] = (byPage[r.page_context || 'unknown'] || 0) + 1;
      byUrgency[r.urgency || 'unknown'] = (byUrgency[r.urgency || 'unknown'] || 0) + 1;
      if (r.contact_email || r.contact_name) withContact++;
    });
    const stats = [
      `${rows.length} total`,
      `${withContact} with contact`,
      ...Object.entries(byProduct).map(([k,v]) => `${k}: ${v}`),
    ].join(' · ');

    // Table rows.
    const fmtDate = s => {
      try {
        const d = new Date(s);
        return d.toLocaleDateString('en-IE', {month:'short', day:'numeric'}) + ' ' +
               d.toLocaleTimeString('en-IE', {hour:'2-digit', minute:'2-digit'});
      } catch (_) { return s; }
    };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'

const EV_LABELS = {
  'call-ended':    { cls: 'ev-call-ended',    icon: '📵' },
  'lead-captured': { cls: 'ev-lead-captured', icon: '🎯' },
  'lead-error':    { cls: 'ev-lead-error',    icon: '⚠️' },
  'demo-complete': { cls: 'ev-demo-complete', icon: '✅' },
  'booking':       { cls: 'ev-booking',       icon: '📅' },
  'avail-check':   { cls: 'ev-avail-check',   icon: '🔍' },
};

let showDetail = false;
let lastEventId = 0;

async function loadEvents() {
  const res = await fetch(`${BASE}/admin/api/events?token=${TOKEN}&limit=300`);
  if (!res.ok) return;
  const events = await res.json();

  // Flash live dot on new events
  if (events.length && events[0].id !== lastEventId) {
    lastEventId = events[0].id;
    const dot = document.getElementById('liveDot');
    dot.style.background = '#ef4444';
    setTimeout(() => { dot.style.background = '#22d3ee'; }, 800);
  }

  // Group by call_id, preserve insertion order
  const groups = {};
  const order = [];
  for (const ev of events) {
    const key = ev.call_id || '__no_call__';
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(ev);
  }

  const el = document.getElementById('callsEventLog');
  const ts = new Date().toLocaleTimeString('en-IE', {hour:'2-digit', minute:'2-digit', second:'2-digit'});

  // Auto-prefill setup-link phone from most-recent lead-captured event (only
  // if Adam hasn't typed something already).
  const phoneInput = document.getElementById('sslPhone');
  if (phoneInput && !phoneInput.value.trim()) {
    const latestLead = events.find(e => e.event_type === 'lead-captured');
    if (latestLead) {
      try {
        const d = JSON.parse(latestLead.detail || '{}');
        if (d.contact_phone && String(d.contact_phone).startsWith('+')) {
          phoneInput.value = d.contact_phone;
        }
      } catch(e) {}
    }
  }

  if (!events.length) {
    el.innerHTML = '<div class="empty">No call events yet.<br>Events appear here as soon as a call hits any endpoint.</div>';
    return;
  }

  el.innerHTML = `
    <div class="log-controls">
      <label><input type="checkbox" onchange="toggleDetail(this.checked)" ${showDetail ? 'checked' : ''}> Show raw detail</label>
      <span class="refresh-indicator">Auto-refresh every 5s · Last: ${ts}</span>
    </div>
  ` + order.map(callId => {
    const evs = groups[callId];
    const first = evs[evs.length - 1]; // oldest first
    const last  = evs[0];
    const callIdShort = callId === '__no_call__' ? '—' : callId.substring(0, 8) + '…';

    // Find lead info for header
    const leadEv = evs.find(e => e.event_type === 'lead-captured');
    let headerInfo = '';
    if (leadEv) {
      try {
        const d = JSON.parse(leadEv.detail || '{}');
        headerInfo = `${esc(d.name || '')} · ${esc(d.business_type || '')}`;
      } catch(e) {}
    }
    const demoEv = evs.find(e => e.event_type === 'demo-complete');
    let heatBadge = '';
    if (demoEv) {
      try {
        const d = JSON.parse(demoEv.detail || '{}');
        const heat = {'very_interested':'🔥 HOT','curious':'🌡 WARM','just_browsing':'❄ COLD'}[d.interest_level] || '';
        heatBadge = heat ? `<span class="status-badge" style="background:#1e3a2e;color:#4ade80;margin-left:6px">${heat}</span>` : '';
      } catch(e) {}
    }

    const evRows = [...evs].reverse().map(ev => {
      const label = EV_LABELS[ev.event_type] || { cls: '', icon: '•' };
      const time = ev.created_at ? ev.created_at.split('T')[1]?.substring(0,8) || ev.created_at.substring(11,19) : '';
      let detailHtml = '';
      if (showDetail && ev.detail && ev.detail !== '{}') {
        try {
          detailHtml = `<div class="ev-detail">${esc(JSON.stringify(JSON.parse(ev.detail), null, 2))}</div>`;
        } catch(e) {}
      }
      return `
        <div class="call-event">
          <span class="ev-time">${time}</span>
          <span class="ev-type ${label.cls}">${label.icon} ${esc(ev.event_type)}</span>
          <span class="ev-summary">
            <span style="color:#475569;font-size:0.72rem">${esc(ev.assistant || '')}</span>
            &nbsp;${esc(ev.summary || '')}
            ${detailHtml}
          </span>
        </div>`;
    }).join('');

    return `
      <div class="call-group">
        <div class="call-group-header">
          <div>
            <span class="call-id-label">call: ${callIdShort}</span>
            ${headerInfo ? `&nbsp;·&nbsp;<strong>${headerInfo}</strong>` : ''}
            ${heatBadge}
          </div>
          <div style="color:#475569;font-size:0.72rem">${fmtDate(first.created_at)}</div>
        </div>
        ${evRows}
      </div>`;
  }).join('');
}

function toggleDetail(on) {
  showDetail = on;
  loadEvents();
}

async function provision(id) {
  const btn = document.getElementById(`prov-${id}`);
  btn.disabled = true;
  btn.textContent = 'Provisioning...';
  try {
    const res = await fetch(`${BASE}/admin/api/provision/${id}?token=${TOKEN}`, { method: 'POST' });
    const data = await res.json();
    if (res.ok) {
      showToast(`Provisioned! Assistant: ${data.assistant_id.substring(0,8)}...`, 'success');

async function sendSetupLink() {
  const phone = document.getElementById('sslPhone').value.trim();
  const tier = document.getElementById('sslTier').value;
  const includeSetup = document.getElementById('sslSetup').checked;
  const resultEl = document.getElementById('sslResult');
  if (!phone.startsWith('+') || phone.length < 8) {
    resultEl.innerHTML = '<span style="color:#ef4444">Phone must be E.164 (start with +, min 8 chars)</span>';
    return;
  }
  resultEl.innerHTML = '<span style="color:#fbbf24">Sending…</span>';
  try {
    const res = await fetch(`${BASE}/admin/api/send-setup-link?token=${encodeURIComponent(TOKEN)}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone, tier, include_setup: includeSetup})
    });
    const d = await res.json();
    if (res.ok && d.ok) {
      const tierLabel = tier === 'professional' ? 'Professional (€249/mo)' : 'Growth (€397/mo)';
      const setupBit = includeSetup ? ' + €297 setup' : '';
      resultEl.innerHTML = `<span style="color:#4ade80">✓ Sent to ${esc(phone)} · ${tierLabel}${setupBit} · SMS ${esc(d.sms_status)} · `
        + `<a href="${esc(d.checkout_url)}" target="_blank" rel="noopener" style="color:#22d3ee">checkout URL</a> · `
        + `<code style="font-size:0.7rem;color:#64748b">${esc(d.session_id)}</code></span>`;
      showToast('SMS sent', 'success');
    } else {
      resultEl.innerHTML = `<span style="color:#ef4444">FAIL (HTTP ${res.status}): ${esc(d.detail || JSON.stringify(d).slice(0,200))}</span>`;
      showToast('Send failed', 'error');
    }
  } catch (e) {
    resultEl.innerHTML = `<span style="color:#ef4444">Network error: ${esc(e.message)}</span>`;
    showToast('Network error', 'error');
  }
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type}`;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3500);
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s + (s.endsWith('Z') ? '' : 'Z'));
  return d.toLocaleDateString('en-IE', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

  if (canary.length > 0) {
    const rows = canary.map(c => {
      const pctColor = c.pct_of_cap >= 80 ? '#ef4444' : (c.pct_of_cap >= 50 ? '#fbbf24' : '#4ade80');
      return `<tr>
        <td style="padding:6px 8px">${esc(c.name)}</td>
        <td style="padding:6px 8px">$${c.spend_today.toFixed(2)} / $${c.daily_cap_usd.toFixed(2)}</td>
        <td style="padding:6px 8px;color:${pctColor};font-weight:600">${c.pct_of_cap}%</td>
        <td style="padding:6px 8px"><button class="btn btn-reject" style="font-size:0.75rem;padding:4px 10px" onclick="pauseCampaign('${esc(c.id)}')">Pause</button></td>
      </tr>`;
    }).join('');
    canaryCard = `
      <div class="card">
        <div class="card-header">
          <div class="biz-name">Live canary — today's spend</div>
        </div>
        <table style="width:100%;font-size:0.85rem;border-collapse:collapse">
          <thead><tr style="text-align:left;color:#64748b;border-bottom:1px solid #334155">
            <th style="padding:6px 8px">Campaign</th><th style="padding:6px 8px">Spend / Cap</th><th style="padding:6px 8px">% Used</th><th style="padding:6px 8px"></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    document.getElementById('adsLiveDot').style.display = 'inline-block';
  } else {
    document.getElementById('adsLiveDot').style.display = 'none';
  }

  // Existing campaigns list
  const campRows = adsCampaigns.length === 0
    ? '<div class="empty">No campaigns yet. Create draft above.</div>'
    : adsCampaigns.map(c => {
        const ins = (c.insights && c.insights.data && c.insights.data[0]) || {};
        const statusClass = c.status === 'ACTIVE' ? 'status-active'
          : c.status === 'PAUSED' ? 'status-pending' : 'status-rejected';
        const actionBtn = c.status === 'ACTIVE'
          ? `<button class="btn btn-reject" onclick="pauseCampaign('${esc(c.id)}')">Pause</button>`
          : c.status === 'PAUSED'
          ? `<button class="btn btn-provision" onclick="activateCampaign('${esc(c.id)}', '${esc(c.name)}')">Activate (real spend)</button>`
          : '';
        return `<div class="card">
          <div class="card-header">
            <div class="biz-name">${esc(c.name)}</div>
            <span class="status-badge ${statusClass}">${esc(c.status)}</span>
          </div>
          <div class="meta">
            <strong>Objective:</strong> ${esc(c.objective || '')}
            &nbsp;&nbsp;<strong>Daily budget:</strong> ${c.daily_budget ? '$'+(c.daily_budget/100).toFixed(2) : '—'}
            &nbsp;&nbsp;<strong>ID:</strong> <span class="assist-id">${esc(c.id)}</span>
          </div>
          <div class="detail-row">
            <strong>Last 7d:</strong> $${ins.spend || '0'} spend · ${ins.impressions || 0} impr · ${ins.clicks || 0} clicks · CTR ${ins.ctr || '0'}%
          </div>
          <div class="actions" style="margin-top:8px">${actionBtn}</div>
        </div>`;
      }).join('');

  sec.innerHTML = acctCard + draftCard + canaryCard +
    `<div style="font-size:0.9rem;color:#94a3b8;margin:18px 0 8px">All campaigns</div>` + campRows;
}

async function createDraft() {
  const template_key = document.getElementById('draftTemplate').value;
  const page_id = document.getElementById('draftPage').value;
  const daily_budget_usd = parseFloat(document.getElementById('draftBudget').value);
  if (!page_id) { showToast('Pick a Page first', 'error'); return; }
  if (!daily_budget_usd || daily_budget_usd <= 0) { showToast('Enter a budget', 'error'); return; }

  try {
    const res = await fetch(`${BASE}/admin/api/ads/draft?token=${TOKEN}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({template_key, page_id, daily_budget_usd}),
    });
    const data = await res.json();
    if (!res.ok) {
      showToast(`Draft failed: ${data.detail || data.error || 'unknown'}`, 'error');
      return;
    }
    showToast(`Draft created (PAUSED). Campaign ${data.campaign_id}`, 'success');
    loadAds();
  } catch (e) {
    showToast(`Network error: ${e.message}`, 'error');
  }
}

async function activateCampaign(id, name) {
  if (!confirm(`ACTIVATE campaign "${name}"?\n\nThis starts REAL spending immediately.\nClick OK only if budget + creative + targeting are reviewed.`)) return;
  try {
    const res = await fetch(`${BASE}/admin/api/ads/campaigns/${encodeURIComponent(id)}/activate?token=${TOKEN}`, {method: 'POST'});
    const data = await res.json();
    if (res.ok) {
      showToast('Campaign LIVE — real spend starting', 'success');
      loadAds();
    } else {
      showToast(`Activate failed: ${data.detail || JSON.stringify(data)}`, 'error');
    }
  } catch (e) {
    showToast(`Network error: ${e.message}`, 'error');
  }
}

async function pauseCampaign(id) {
  try {
    const res = await fetch(`${BASE}/admin/api/ads/campaigns/${encodeURIComponent(id)}/pause?token=${TOKEN}`, {method: 'POST'});
    if (res.ok) {
      showToast('Campaign paused', 'success');
      loadAds();
    } else {
      const data = await res.json();
      showToast(`Pause failed: ${data.detail || 'unknown'}`, 'error');
    }
  } catch (e) {
    showToast(`Network error: ${e.message}`, 'error');
  }
}
</script>
