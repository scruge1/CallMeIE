  function findSession(sessions, ctx) {
    if (ctx.session_id) return sessions.find((s) => s.id === ctx.session_id) || { id: ctx.session_id, status: "open", amount_total: ctx.estimated_value_minor || 54600, currency: "eur" };
    const phone = String(ctx.phone || "").replace(/\s/g, "");
    return sessions.find((s) => {
      const md = s.metadata || {};
      return phone && String(md.phone || "").replace(/\s/g, "") === phone;
    }) || sessions.find((s) => s.status === "open");
  }

  async function renderFlow() {
    const data = await api("/admin/api/flow-graph");
    const nodes = data.nodes || [];
    const edges = data.edges || [];
    const claire = nodes.find((n) => /claire|qualifier|discovery/i.test(n.name || "")) || nodes[0];
    const others = nodes.filter((n) => n !== claire);
    const right = others.length ? others : nodes.filter((n) => n !== claire);
    return `<section class="panel pad flow-canvas">
      <svg class="flow-svg" viewBox="0 0 860 420" aria-label="Assistant flow graph">
        <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
        ${claire ? flowNode(claire, 120, 190, true) : ""}
        ${right.map((n, i) => flowNode(n, 510, 60 + i * 78, false)).join("")}
        ${right.map((n, i) => `<path d="M220 210 C330 210 350 ${82 + i * 78} 500 ${82 + i * 78}" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>`).join("")}
      </svg>
      <div class="soft-note">${esc(edges.length)} transfer edges detected from live Vapi assistant tools.</div>
    </section>`;
  }

    return `<g transform="translate(${x},${y})">
      <rect width="190" height="46" rx="10" fill="var(--surface)" stroke="var(--border-strong)"/>
      <circle cx="24" cy="23" r="9" fill="${primary ? "var(--warn-soft)" : "var(--accent-soft)"}" stroke="${primary ? "var(--warn)" : "var(--accent)"}"/>
      <text x="42" y="20" fill="var(--text)" font-size="12" font-family="Inter, system-ui" font-weight="700">${esc(n.name || "?")}</text>
      <text x="42" y="35" fill="var(--muted)" font-size="10" font-family="Inter, system-ui">${esc(n.model || "")} · ${esc(n.tools_count || 0)} tools</text>
    </g>`;
  }

  async function renderDiscovery() {
    const rows = await api("/admin/api/discovery-submissions");
    const data = Array.isArray(rows) ? rows : rows.submissions || [];
    return `<section class="panel"><div class="table-wrap"><table><thead><tr><th>Visitor</th><th>Business</th><th>Score</th><th>Tier</th><th>Submitted</th></tr></thead><tbody>
      ${data.length ? data.map((r) => `<tr><td><strong>${esc(r.name || r.visitor_name || "?")}</strong><br><span class="muted">${esc(r.email || "")}</span></td><td>${esc(r.business_type || r.business || "")}</td><td class="mono">${esc(r.score || r.quiz_score || "")}</td><td>${esc(r.tier_recommendation || r.tier || "")}</td><td>${esc(fmtDate(r.created_at || r.submitted_at))}</td></tr>`).join("") : '<tr><td colspan="5" class="empty">No discovery submissions returned.</td></tr>'}
    </tbody></table></div></section>`;
  }

  async function renderAds() {
    const [account, templates, pages, campaigns, canary] = await Promise.all([
      api("/admin/api/ads/account"),
      api("/admin/api/ads/templates"),
      api("/admin/api/ads/pages"),
      api("/admin/api/ads/campaigns", { params: { limit: 200 } }),
      api("/admin/api/ads/canary"),
    ]);
    const caps = account.budget_caps || {};
    const campaignRows = campaigns.data || campaigns.campaigns || [];
    return `<div class="grid-2">
      <section class="panel pad">
        <h2 class="panel-title">Ad account</h2>
        <p class="muted">${esc(account.configured ? "Configured" : "Not configured")} · cap ${esc(caps.hardcap_usd || "?")} USD/day</p>
        <div class="soft-note">${esc((templates.templates || []).length)} templates · ${esc((pages.data || []).length)} pages · ${esc((canary.campaigns || []).length)} live canaries</div>
      </section>
      <section class="panel pad">
        <h2 class="panel-title">Create draft</h2>
        <div class="composer">
          <select id="draftTemplate" class="select">${(templates.templates || []).map((t) => `<option value="${esc(t.key)}">${esc(t.campaign_name || t.key)}</option>`).join("")}</select>
          <select id="draftPage" class="select">${(pages.data || []).map((p) => `<option value="${esc(p.id)}">${esc(p.name || p.id)}</option>`).join("")}</select>
          <input id="draftBudget" class="input" type="number" min="0.5" step="0.5" value="${esc(caps.default_daily_max_usd || 2)}">
          <button class="btn primary" type="button" onclick="createDraft()">Create draft paused</button>
        </div>
      </section>
      <section class="panel full-span"><div class="table-wrap"><table><thead><tr><th>Campaign</th><th>Status</th><th>Budget</th><th>Insights</th><th></th></tr></thead><tbody>
      ${campaignRows.length ? campaignRows.map((c) => `<tr><td>${esc(c.name)}</td><td><span class="badge ${c.status === "ACTIVE" ? "ok" : "warm"}">${esc(c.status)}</span></td><td>${esc(c.daily_budget ? `$${(c.daily_budget / 100).toFixed(2)}` : "")}</td><td>${esc((((c.insights || {}).data || [])[0] || {}).clicks || 0)} clicks</td><td>${c.status === "ACTIVE" ? `<button class="btn danger" onclick="pauseCampaign('${esc(c.id)}')">Pause</button>` : `<button class="btn primary" onclick="activateCampaign('${esc(c.id)}','${esc(c.name)}')">Activate</button>`}</td></tr>`).join("") : '<tr><td colspan="5" class="empty">No campaigns returned.</td></tr>'}
      </tbody></table></div></section>
    </div>`;
  }

  async function createDraft() {
    try {
      const body = {
        template_key: qs("#draftTemplate").value,
        page_id: qs("#draftPage").value,
        daily_budget_usd: Number(qs("#draftBudget").value),
      };
      await api("/admin/api/ads/draft", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      showToast("Draft campaign created");
      loadMore("ads");
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  async function activateCampaign(id, name) {
    if (!confirm(`Activate campaign "${name}"? This starts real spend.`)) return;
    try {
      await api(`/admin/api/ads/campaigns/${encodeURIComponent(id)}/activate`, { method: "POST" });
      showToast("Campaign activated");
      loadMore("ads");
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  async function pauseCampaign(id) {
    try {
      await api(`/admin/api/ads/campaigns/${encodeURIComponent(id)}/pause`, { method: "POST" });
      showToast("Campaign paused", "warn");
      loadMore("ads");
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  window.createDraft = createDraft;
  window.activateCampaign = activateCampaign;
  window.pauseCampaign = pauseCampaign;

  async function renderInbox() {
    const data = await api("/admin/api/leads-unified", { params: { limit: 120 } });
    return renderUnifiedInbox(data.leads || data.items || []);
  }

  async function renderSettings() {
    const [heatRes, twilioRes] = await Promise.allSettled([
      api("/admin/api/heat-by-assistant"),
      api("/admin/api/twilio-numbers"),
    ]);
    const heat = valueOf(heatRes, { assistants: [] });
    const twilio = valueOf(twilioRes, { numbers: [] });
    return `
      <div class="grid-2">
        <section class="panel pad">
          <h2 class="panel-title">Theme</h2>
          <p class="muted">Persisted in localStorage.admin_theme. Auto follows OS preference.</p>
          <div class="panel-actions">
            ${["light", "dark", "auto"].map((mode) => `<button class="btn ${state.themeMode === mode ? "primary" : ""}" type="button" onclick="setTheme('${mode}')">${title(mode)}</button>`).join("")}
          </div>
        </section>
        <section class="panel pad">
          <h2 class="panel-title">Admin token rotation</h2>
          <p class="muted">New token is displayed once and saved locally.</p>
          <button class="btn danger" type="button" onclick="rotateAdminToken()">Rotate ADMIN_TOKEN now</button>
          <div id="rotateResult" class="soft-note" hidden></div>
        </section>
        <section class="panel pad">
          <h2 class="panel-title">Twilio numbers</h2>
          ${(twilio.numbers || []).map((n) => `<div class="pulse-row"><span class="mono">${esc(n.phone_number || n.number || "?")}</span><span>${n.capabilities && n.capabilities.sms ? '<span class="badge ok">SMS</span>' : '<span class="badge warn">No SMS</span>'}</span></div>`).join("") || '<div class="empty">No Twilio numbers returned.</div>'}
          <button class="btn" type="button" onclick="testSms()">${icon("send")}Test SMS to owner</button>
          <div id="testSmsResult" class="muted"></div>
        </section>
        <section class="panel pad">
          <h2 class="panel-title">Heat by assistant</h2>
          ${(heat.assistants || []).map((a) => `<div class="pulse-row"><span>${esc(a.assistant || "?")}</span><span><span class="badge hot">${esc(a.very_interested || 0)} hot</span> <span class="badge warm">${esc(a.curious || 0)} warm</span> <span class="badge cold">${esc(a.just_browsing || 0)} cold</span></span></div>`).join("") || '<div class="empty">No heat data returned.</div>'}
        </section>
        <section class="panel pad">
          <h2 class="panel-title">Deployment</h2>
          <div class="panel-actions">
            <button id="redeploySettingsBtn" class="btn" type="button" onclick="coolifyRedeploy('redeploySettingsBtn')">${icon("refresh")}Coolify redeploy</button>
            <button class="btn" type="button" onclick="exportData()">${icon("download")}Data export</button>
            <button class="btn" type="button" onclick="logout()">Sign out</button>
          </div>
        </section>
      </div>`;
  }

  async function rotateAdminToken() {
    if (!confirm("Rotate ADMIN_TOKEN now? The container may restart briefly.")) return;
    const out = qs("#rotateResult");
    out.hidden = false;
    out.textContent = "Rotating...";
    try {
      const data = await api("/admin/api/admin-token-rotate", { method: "POST" });
      if (data.new_token) {
        state.token = data.new_token;
        localStorage.setItem(STORAGE_TOKEN, data.new_token);
      }
      out.innerHTML = `<strong class="ok-text">New token saved locally.</strong><br><code class="mono">${esc(data.new_token || "")}</code>`;
      showToast("Admin token rotated");
    } catch (err) {
      out.textContent = err.message;
      out.className = "soft-note fail-text";
    }
  }

  async function testSms() {
    const out = qs("#testSmsResult");
    out.textContent = "Sending...";
    try {
      const data = await api("/admin/api/test-sms", { method: "POST" });
      out.textContent = data.ok ? "Test SMS sent." : JSON.stringify(data);
      out.className = data.ok ? "ok-text" : "warn-text";
    } catch (err) {
      out.textContent = err.message;
      out.className = "fail-text";
    }
  }

  async function coolifyRedeploy(buttonId) {
    if (!confirm("Trigger Coolify redeploy now?")) return;
    const btn = qs(`#${buttonId}`);
    if (btn) btn.disabled = true;
    try {
      await api("/admin/api/coolify-redeploy", { method: "POST" });
      showToast("Redeploy triggered");
    } catch (err) {
      showToast(err.message, "error");
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  async function exportData() {
    try {
      const data = await api("/admin/api/data-export");
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "callmeie-admin-export.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("Export downloaded");
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  window.rotateAdminToken = rotateAdminToken;
  window.testSms = testSms;
  window.coolifyRedeploy = coolifyRedeploy;
  window.exportData = exportData;

  function renderMoreSheet() {
    qs("#moreSheetBody").innerHTML = `<div class="more-grid">${MORE_ITEMS.map(([key, label, sub, iconName]) => `
      <button class="more-tile" type="button" onclick="navigate('more','${key}')">
        ${icon(iconName)}
        <strong>${esc(label)}</strong>
        <span class="muted">${esc(sub)}</span>
      </button>
    `).join("")}</div>`;
  }

  function openMoreSheet() {
    qs("#moreSheet").classList.add("open");
    qs("#moreSheet").setAttribute("aria-hidden", "false");
    qs("#sheetBackdrop").classList.add("open");
  }

  function closeMoreSheet() {
    qs("#moreSheet").classList.remove("open");
    qs("#moreSheet").setAttribute("aria-hidden", "true");
    qs("#sheetBackdrop").classList.remove("open");
  }

  window.openMoreSheet = openMoreSheet;
  window.closeMoreSheet = closeMoreSheet;

  function renderHelp() {
    qs("#helpBody").innerHTML = `
      <div class="help-grid">
        ${[
          ["1", "Open Today"],
          ["2", "Open Leads"],
          ["3", "Open Calls"],
          ["4", "Open Books"],
          ["R", "Reload current view"],
          ["H", "Toggle health detail"],
          ["Esc", "Close drawer or sheet"],
          ["?", "Show this help"],
        ].map(([key, label]) => `<div class="shortcut-row"><span>${esc(label)}</span><span class="kbd">${esc(key)}</span></div>`).join("")}
      </div>`;
  }

  function showHelp() {
    qs("#modalBackdrop").classList.add("open");
    qs("#helpModal").classList.add("open");
  }

  function closeModal() {
    qs("#modalBackdrop").classList.remove("open");
    qs("#helpModal").classList.remove("open");
  }

  window.closeModal = closeModal;

  function handleKeys(event) {
    const tag = (event.target && event.target.tagName || "").toLowerCase();
    const typing = ["input", "select", "textarea"].includes(tag);
    if (typing && event.key !== "Escape") return;
    if (event.key === "Escape") {
      closeDrawer();
      closeMoreSheet();
      closeModal();
      return;
    }
    if (event.key === "?") {
      event.preventDefault();
      showHelp();
      return;
    }
    if (event.key >= "1" && event.key <= "4") {
      event.preventDefault();
      navigate(PRIMARY_TABS[Number(event.key) - 1]);
      return;
    }
    if (event.key.toLowerCase() === "r") {
      event.preventDefault();
      reloadCurrent();
      return;
    }
    if (event.key.toLowerCase() === "h") {
      event.preventDefault();
      toggleHealthDetail();
    }
  }

  function copyText(text) {
    navigator.clipboard.writeText(String(text || "")).then(() => showToast("Copied"));
  }

  function copyFromInput(id) {
    const el = qs(`#${id}`);
    if (el) copyText(el.value);
  }

  window.copyText = copyText;
  window.copyFromInput = copyFromInput;

  function renderError(titleText, detail) {
    return `<section class="panel pad"><h1 class="panel-title">${esc(titleText)}</h1><p class="muted">${esc(detail || "Unknown error")}</p></section>`;
  }

  function initTheme() {
    const saved = localStorage.getItem(STORAGE_THEME) || "light";
    state.themeMode = saved;
    applyTheme(saved);
  }

  function setTheme(mode) {
    localStorage.setItem(STORAGE_THEME, mode);
    state.themeMode = mode;
    applyTheme(mode);
    if (state.currentTab === "more" && state.currentMore === "settings") loadMore("settings");
  }

  function applyTheme(mode) {
    const root = document.documentElement;
    const dark = mode === "dark" || (mode === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    root.classList.toggle("theme-dark", dark);
    updateThemeColor();
  }

  window.setTheme = setTheme;

  window.addEventListener("load", init);
})();
</script>
</body>
</html>
