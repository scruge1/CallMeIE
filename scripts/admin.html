<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="Canvas">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CallMeIE">
<title>CallMeIE Admin</title>
<link rel="manifest" href="/admin/manifest.json">
<link rel="icon" type="image/svg+xml" href="/admin/icon-192.svg">
<link rel="apple-touch-icon" href="/admin/icon-192.svg">
<style>
  :root {
    color-scheme: light;
    --bg: #f7f8fa;
    --bg-soft: #fbfbfc;
    --surface: #ffffff;
    --surface-soft: #f9fafb;
    --surface-raised: #ffffff;
    --surface-muted: #f1f3f5;
    --border: #e8eaef;
    --border-strong: #d7dbe2;
    --text: #1a1d24;
    --text-soft: #374151;
    --muted: #6b7280;
    --dim: #9aa1ad;
    --accent: #025b60;
    --accent-2: #0f766e;
    --accent-soft: #e4f2f1;
    --accent-press: #01484c;
    --brand: #0b773f;
    --ok: #147d4d;
    --ok-soft: #e8f6ee;
    --warn: #b66a17;
    --warn-soft: #fff3df;
    --fail: #d92d45;
    --fail-soft: #fff0f2;
    --cold: #69717d;
    --cold-soft: #f1f3f5;
    --shadow-1: 0 1px 2px rgba(16, 24, 40, 0.04);
    --shadow-2: 0 10px 30px rgba(16, 24, 40, 0.08);
    --shadow-3: 0 24px 70px rgba(16, 24, 40, 0.14);
    --scrim: rgba(15, 23, 42, 0.34);
    --mobile-nav-shadow: 0 -8px 24px rgba(16, 24, 40, 0.06);
    --on-accent: #ffffff;
    --radius-xs: 6px;
    --radius-sm: 8px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 22px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
    --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  :root.theme-dark {
    color-scheme: dark;
    --bg: #111827;
    --bg-soft: #0f172a;
    --surface: #172033;
    --surface-soft: #131c2d;
    --surface-raised: #1b263a;
    --surface-muted: #0d1423;
    --border: #263348;
    --border-strong: #334155;
    --text: #f4f7fb;
    --text-soft: #d5dbe6;
    --muted: #9aa6b8;
    --dim: #718096;
    --accent: #25c6c8;
    --accent-2: #2dd4bf;
    --accent-soft: #12383f;
    --accent-press: #63e6e2;
    --brand: #7be0a1;
    --ok: #5fd18b;
    --ok-soft: #12351f;
    --warn: #f3b35d;
    --warn-soft: #3a2712;
    --fail: #ff6b81;
    --fail-soft: #401823;
    --cold: #a8b0bd;
    --cold-soft: #253044;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.28);
    --shadow-2: 0 14px 34px rgba(0, 0, 0, 0.34);
    --shadow-3: 0 30px 80px rgba(0, 0, 0, 0.46);
    --scrim: rgba(2, 6, 23, 0.58);
    --mobile-nav-shadow: 0 -8px 24px rgba(0, 0, 0, 0.34);
    --on-accent: #071214;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { min-height: 100%; background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at top left, color-mix(in srgb, var(--surface) 82%, transparent), transparent 34rem),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  button, input, select, textarea {
    font: inherit;
  }

  button {
    color: inherit;
  }

  a {
    color: var(--accent);
    text-decoration: none;
  }

  a:hover { text-decoration: underline; }

  ::selection {
    background: var(--accent-soft);
    color: var(--text);
  }

  .app-shell {
    min-height: 100vh;
    padding: var(--space-3);
  }

  .login-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: var(--space-6);
  }

  .login-card {
    width: min(420px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    padding: var(--space-8);
  }

  .login-brand {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--brand);
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.03em;
    margin: 0 0 var(--space-4);
  }

  .login-card h1 {
    font-size: 18px;
    margin: 0 0 var(--space-2);
    letter-spacing: -0.02em;
  }

  .login-card p {
    margin: 0 0 var(--space-5);
    color: var(--muted);
    font-size: 13px;
  }

  .app-frame {
    min-height: calc(100vh - var(--space-6));
    background: color-mix(in srgb, var(--surface) 76%, var(--bg));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    overflow: clip;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    min-height: 76px;
    display: grid;
    grid-template-columns: 180px minmax(260px, 1fr) auto;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-4) var(--space-5);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .wordmark {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--brand);
    font-size: 28px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.04em;
    white-space: nowrap;
  }

  .command-wrap {
    position: relative;
    max-width: 440px;
  }

  .command-input,
  .input,
  .select,
  .textarea {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--text);
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
  }

  .command-input {
    height: 40px;
    padding: 0 46px 0 44px;
    font-size: 13px;
    box-shadow: var(--shadow-1);
  }

  .input, .select {
    min-height: 38px;
    padding: 8px 10px;
    font-size: 13px;
  }

  .textarea {
    min-height: 150px;
    resize: vertical;
    padding: 10px;
    font-size: 13px;
    line-height: 1.5;
  }

  .command-input:focus,
  .input:focus,
  .select:focus,
  .textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .search-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    width: 16px;
    height: 16px;
  }

  .kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 22px;
    padding: 0 6px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: var(--surface-muted);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }

  .command-wrap .kbd {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--space-2);
    min-width: 0;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 38px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-raised);
    color: var(--text);
    font-size: 13px;
    white-space: nowrap;
    box-shadow: var(--shadow-1);
  }

  .chip.small {
    height: 30px;
    padding: 0 10px;
    font-size: 12px;
  }

  .chip.muted {
    color: var(--muted);
    background: var(--surface-soft);
  }

  .chip.ok { color: var(--ok); background: var(--ok-soft); }
  .chip.warn { color: var(--warn); background: var(--warn-soft); }
  .chip.fail { color: var(--fail); background: var(--fail-soft); }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: currentColor;
    box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 12%, transparent);
  }

  .money-chip strong {
    display: block;
    color: var(--ok);
    font-size: 13px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .money-chip span {
    display: block;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.1;
  }

  .operator {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 0;
    border-left: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    padding-left: 14px;
    min-width: 136px;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-muted);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
  }

  .operator-name {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.1;
  }

  .operator-role {
    color: var(--muted);
    font-size: 11px;
  }

  .primary-tabs {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 var(--space-4);
  }

  .tab-btn {
    appearance: none;
    border: 0;
    background: transparent;
    min-height: 68px;
    padding: 0 var(--space-4);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    color: var(--text-soft);
    font-weight: 650;
    font-size: 14px;
    position: relative;
    transition: color 160ms ease, background 160ms ease;
  }

  .tab-btn:hover {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent-soft) 55%, transparent);
  }

  .tab-btn.active {
    color: var(--accent);
  }

  .tab-btn.active::after {
    content: "";
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 0;
    height: 3px;
    border-radius: 999px 999px 0 0;
    background: var(--accent);
  }

  .tab-btn svg,
  .icon {
    width: 18px;
    height: 18px;
    flex: none;
  }

  .content {
    flex: 1;
    padding: var(--space-4);
    overflow: auto;
  }

  .view {
    display: none;
    animation: fadeIn 160ms ease;
  }

  .view.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important;
      transition-duration: 1ms !important;
      scroll-behavior: auto !important;
    }
  }

  .dashboard-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: var(--space-4);
    align-items: start;
  }

  .main-column {
    min-width: 0;
  }

  .side-grid {
    display: grid;
    gap: var(--space-4);
    align-items: start;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-1);
  }

  .panel.pad {
    padding: var(--space-4);
  }

  .panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-4) var(--space-3);
    border-bottom: 1px solid var(--border);
  }

  .panel-title {
    margin: 0;
    font-size: 14px;
    font-weight: 760;
    letter-spacing: -0.01em;
  }

  .panel-subtitle {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 11px;
  }

  .panel-actions {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    flex-wrap: wrap;
  }

  .panel-body {
    padding: var(--space-4);
  }

  .action-list,
  .row-list {
    display: grid;
  }

  .action-row {
    display: grid;
    grid-template-columns: 42px 42px minmax(0, 1fr) 104px 96px 180px;
    gap: var(--space-3);
    align-items: center;
    min-height: 78px;
    padding: 0 var(--space-4);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 160ms ease;
  }

  .action-row:last-child { border-bottom: 0; }

  .action-row:hover {
    background: var(--surface-soft);
  }

  .row-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: stretch;
    min-width: 0;
  }

  .row-actions > .btn.primary { width: 100%; }

  .flag-btns {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }

  .flag-btns.compact { flex-wrap: wrap; }

  .flag-btn {
    padding: 4px 8px;
    font-size: 12px;
    line-height: 1.1;
    min-height: 26px;
    border-radius: var(--radius-xs);
    flex: 1 1 auto;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }

  .pipeline-status-cell {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }

  .pipeline-status-cell .select {
    padding: 3px 8px;
    font-size: 11px;
    min-height: 24px;
  }

  .flag-btn.flag-real:hover  { color: var(--ok);   border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); background: var(--ok-soft, color-mix(in srgb, var(--ok) 10%, var(--surface))); }
  .flag-btn.flag-test:hover  { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); }
  .flag-btn.flag-spam:hover  { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 40%, var(--border)); background: color-mix(in srgb, var(--fail) 10%, var(--surface)); }
  .flag-btn.flag-discard:hover { color: var(--muted); border-color: var(--border-strong, var(--border)); background: var(--surface-muted); }

  .rank {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-xs);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-muted);
    color: var(--muted);
    font-weight: 760;
    font-variant-numeric: tabular-nums;
  }

  .rank.hot { color: var(--fail); background: var(--fail-soft); }
  .rank.warm { color: var(--warn); background: var(--warn-soft); }

  .initials {
    width: 34px;
    height: 34px;
    border-radius: 999px;
    background: var(--surface-muted);
    color: var(--text-soft);
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 720;
    text-transform: uppercase;
  }

  .row-title {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    color: var(--text);
    font-size: 13px;
    font-weight: 760;
    letter-spacing: -0.01em;
  }

  .row-title span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .row-sub {
    margin-top: 3px;
    color: var(--muted);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .metric-cell {
    min-width: 0;
    font-size: 11px;
    color: var(--muted);
  }

  .metric-cell strong {
    display: block;
    color: var(--text);
    font-size: 13px;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 20px;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-soft);
    color: var(--muted);
    font-size: 10px;
    line-height: 1;
    font-weight: 760;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .badge.hot { color: var(--fail); background: var(--fail-soft); border-color: color-mix(in srgb, var(--fail) 24%, var(--border)); }
  .badge.warm { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 26%, var(--border)); }
  .badge.cold { color: var(--cold); background: var(--cold-soft); }
  .badge.ok { color: var(--ok); background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 22%, var(--border)); }
  .badge.warn { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 26%, var(--border)); }
  .badge.fail { color: var(--fail); background: var(--fail-soft); border-color: color-mix(in srgb, var(--fail) 24%, var(--border)); }

  .btn {
    min-height: 38px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 14px;
    font-size: 12px;
    font-weight: 760;
    cursor: pointer;
    transition: transform 120ms ease, background 160ms ease, border-color 160ms ease, color 160ms ease;
    white-space: nowrap;
  }

  .btn:hover {
    border-color: var(--border-strong);
    background: var(--surface-soft);
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 22%, transparent);
  }

  .btn.primary:hover {
    background: var(--accent-press);
    border-color: var(--accent-press);
  }

  .btn.danger {
    color: var(--fail);
    background: var(--fail-soft);
    border-color: color-mix(in srgb, var(--fail) 25%, var(--border));
  }

  .btn.ghost {
    background: transparent;
    box-shadow: none;
  }

  .btn.icon-btn {
    width: 38px;
    padding: 0;
  }

  .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
  }

  .mini-list {
    display: grid;
  }

  .mini-row {
    display: grid;
    grid-template-columns: 24px 48px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    min-height: 44px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }

  .mini-row:last-child { border-bottom: 0; }

  .mini-row .icon-pill {
    width: 24px;
    height: 24px;
    border-radius: var(--radius-xs);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-muted);
    color: var(--accent);
  }

  .time {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }

  .truncate {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  .muted { color: var(--muted); }
  .dim { color: var(--dim); }
  .ok-text { color: var(--ok); }
  .warn-text { color: var(--warn); }
  .fail-text { color: var(--fail); }
  .accent-text { color: var(--accent); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }

  .money-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-3);
    margin-bottom: var(--space-4);
  }

  .money-stat {
    min-width: 0;
  }

  .money-stat span {
    display: block;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-bottom: 2px;
  }

  .money-stat strong {
    font-size: 15px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .sparkline {
    width: 100%;
    height: 70px;
    color: var(--accent);
    opacity: 0.9;
  }

  .pulse-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    min-height: 32px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }

  .pulse-row:last-child { border-bottom: 0; }

  .recording-row {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) 90px 34px;
    gap: 10px;
    align-items: center;
    min-height: 42px;
    border-bottom: 1px solid var(--border);
  }

  .recording-row:last-child { border-bottom: 0; }

  .play {
    width: 28px;
    height: 28px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--accent);
  }

  .wave {
    height: 20px;
    opacity: 0.55;
    background:
      linear-gradient(90deg,
        color-mix(in srgb, var(--muted) 0%, transparent) 0,
        color-mix(in srgb, var(--muted) 0%, transparent) 4px,
        var(--muted) 4px,
        var(--muted) 6px,
        color-mix(in srgb, var(--muted) 0%, transparent) 6px,
        color-mix(in srgb, var(--muted) 0%, transparent) 10px);
    background-size: 10px 100%;
    mask-image: linear-gradient(90deg, transparent 0, black 8%, black 92%, transparent 100%);
  }

  .empty {
    padding: var(--space-8) var(--space-4);
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  .soft-note {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-soft);
    padding: var(--space-3);
    color: var(--muted);
    font-size: 12px;
  }

  .split {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
    gap: var(--space-4);
    align-items: start;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-4);
  }

  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-4);
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-2);
    margin-bottom: var(--space-4);
  }

  .filter-chip {
    min-height: 34px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    padding: 0 12px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
  }

  .filter-chip.active {
    color: var(--accent);
    background: var(--accent-soft);
    border-color: color-mix(in srgb, var(--accent) 22%, var(--border));
  }

  /* Global no-horizontal-scroll guard. Tables wider than viewport must
     live inside .table-wrap which scrolls horizontally locally. Page
     itself never horizontal-scrolls — long words wrap, images shrink. */
  html, body { overflow-x: hidden; max-width: 100%; }
  img, video, canvas { max-width: 100%; height: auto; }
  pre, code { max-width: 100%; overflow-wrap: anywhere; }

  .table-wrap {
    overflow-x: auto;
    overflow-y: visible;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    /* Tables can still demand 720px MIN inside .table-wrap so columns
       stay legible — the wrap clips horizontally without breaking page. */
    min-width: 640px;
  }

  th, td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: middle;
    font-size: 12px;
  }

  th {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 760;
    background: var(--surface-soft);
  }

  tr:hover td {
    background: color-mix(in srgb, var(--surface-soft) 70%, transparent);
  }

  .call-group {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
    box-shadow: var(--shadow-1);
    margin-bottom: var(--space-3);
  }

  .call-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: var(--space-3);
    align-items: center;
    padding: var(--space-3) var(--space-4);
    background: var(--surface-soft);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }

  .event-row {
    display: grid;
    grid-template-columns: 58px 26px 150px minmax(0, 1fr);
    gap: var(--space-3);
    align-items: start;
    padding: 10px var(--space-4);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }

  .event-row:last-child { border-bottom: 0; }

  .timeline {
    display: grid;
    gap: 0;
    position: relative;
  }

  .timeline-item {
    display: grid;
    grid-template-columns: 54px 26px minmax(0, 1fr);
    gap: 10px;
    min-height: 42px;
    padding-bottom: 10px;
    position: relative;
  }

  .timeline-item::before {
    content: "";
    position: absolute;
    top: 20px;
    bottom: 0;
    left: 66px;
    width: 1px;
    background: var(--border);
  }

  .timeline-item:last-child::before { display: none; }

  .timeline-dot {
    width: 18px;
    height: 18px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid currentColor;
    color: var(--ok);
    background: var(--surface);
    margin-top: 1px;
  }

  .timeline-title {
    font-size: 12px;
    font-weight: 760;
    color: var(--text);
  }

  .timeline-copy {
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
  }

  .composer {
    display: grid;
    gap: var(--space-3);
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: var(--space-2);
    align-items: end;
  }

  .field label,
  .form-label {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 5px;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    color: var(--muted);
    font-size: 12px;
  }

  .switch {
    position: relative;
    display: inline-flex;
    align-items: center;
    width: 34px;
    height: 20px;
  }

  .switch input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .switch span {
    width: 34px;
    height: 20px;
    border-radius: 999px;
    background: var(--border-strong);
    transition: background 160ms ease;
    position: relative;
  }

  .switch span::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    top: 2px;
    left: 2px;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--shadow-1);
    transition: transform 160ms ease;
  }

  .switch input:checked + span {
    background: var(--accent);
  }

  .switch input:checked + span::after {
    transform: translateX(14px);
  }

  .drawer-backdrop,
  .modal-backdrop,
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: var(--scrim);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease;
    z-index: 70;
  }

  .drawer-backdrop.open,
  .modal-backdrop.open,
  .sheet-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .drawer {
    position: fixed;
    top: var(--space-3);
    right: var(--space-3);
    bottom: var(--space-3);
    width: min(480px, calc(100vw - 2 * var(--space-3)));
    max-height: calc(100vh - 2 * var(--space-3));
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-3);
    transform: translateX(calc(100% + var(--space-5)));
    transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 80;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .drawer.open {
    transform: translateX(0);
  }

  .drawer-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: var(--space-3);
    padding: var(--space-4);
    border-bottom: 1px solid var(--border);
  }

  .drawer-title {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    margin: 0;
    font-size: 15px;
    font-weight: 780;
    letter-spacing: -0.02em;
  }

  .drawer-sub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }

  .drawer-body {
    padding: var(--space-4);
    overflow-y: auto;
    overflow-x: hidden;
    display: grid;
    gap: var(--space-4);
    /* min-height: 0 is the classic flex-column scroll fix — without it the
       grid would extend past the flex container and bottom rows would clip. */
    min-height: 0;
    flex: 1 1 auto;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .drawer-body * { max-width: 100%; }
  .drawer-body pre, .drawer-body code {
    white-space: pre-wrap;
    word-break: break-word;
  }

  .drawer-section {
    padding-bottom: var(--space-4);
    border-bottom: 1px solid var(--border);
  }

  .drawer-section:last-child { border-bottom: 0; padding-bottom: 0; }

  .drawer-section h3 {
    margin: 0 0 var(--space-3);
    font-size: 12px;
    font-weight: 780;
    letter-spacing: -0.01em;
  }

  .drawer-footer {
    display: none;
  }

  .bottom-sheet {
    position: fixed;
    left: var(--space-3);
    right: var(--space-3);
    bottom: var(--space-3);
    max-height: min(78vh, 660px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-3);
    z-index: 90;
    transform: translateY(calc(100% + var(--space-5)));
    transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .bottom-sheet.open {
    transform: translateY(0);
  }

  .sheet-handle {
    width: 44px;
    height: 4px;
    border-radius: 999px;
    background: var(--border-strong);
    align-self: center;
    margin: 10px 0 2px;
  }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border);
  }

  .sheet-body {
    padding: var(--space-3) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom));
    overflow: auto;
  }

  .modal {
    position: fixed;
    left: 50%;
    top: 50%;
    width: min(620px, calc(100vw - 32px));
    max-height: min(720px, calc(100vh - 32px));
    transform: translate(-50%, -48%) scale(0.98);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-3);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease, transform 180ms ease;
    z-index: 92;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .modal.open {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  .modal-head {
    padding: var(--space-4);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .modal-body {
    padding: var(--space-4);
    overflow: auto;
  }

  .help-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-3);
  }

  .shortcut-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    min-height: 36px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
  }

  .toast {
    position: fixed;
    right: var(--space-5);
    bottom: var(--space-5);
    z-index: 120;
    max-width: 340px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-3);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: opacity 160ms ease, transform 160ms ease;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  .toast.success { border-color: color-mix(in srgb, var(--ok) 30%, var(--border)); color: var(--ok); }
  .toast.error { border-color: color-mix(in srgb, var(--fail) 30%, var(--border)); color: var(--fail); }
  .toast.warn { border-color: color-mix(in srgb, var(--warn) 30%, var(--border)); color: var(--warn); }

  .more-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-3);
  }

  .more-tile {
    min-height: 84px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    text-align: left;
    padding: var(--space-4);
    display: grid;
    align-content: start;
    gap: 8px;
    cursor: pointer;
    transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
  }

  .more-tile:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-2);
    transform: translateY(-1px);
  }

  .more-tile svg {
    color: var(--accent);
  }

  .view-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    margin-bottom: var(--space-4);
  }

  .view-title-row h1 {
    margin: 0;
    font-size: 18px;
    line-height: 1.2;
    letter-spacing: -0.03em;
  }

  .view-title-row p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 12px;
  }

  .assistant-layout {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: var(--space-4);
  }

  .assistant-list {
    display: grid;
  }

  .assistant-item {
    padding: var(--space-3);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }

  .assistant-item:hover,
  .assistant-item.active {
    background: var(--surface-soft);
  }

  .flow-canvas {
    min-height: 420px;
    overflow: auto;
  }

  .full-span {
    grid-column: 1 / -1;
  }

  .flow-svg {
    min-width: 860px;
    width: 100%;
    height: 420px;
  }

  .mobile-nav {
    display: none;
  }

  .mobile-more-trigger {
    display: none;
  }

  .health-detail {
    display: none;
    margin: 0 0 var(--space-4);
  }

  .health-detail.open { display: block; }

  .probe-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-3);
  }

  .probe {
    border: 1px solid var(--border);
    border-left-width: 3px;
    border-radius: var(--radius-sm);
    padding: var(--space-3);
    background: var(--surface);
  }

  .probe.ok { border-left-color: var(--ok); }
  .probe.warn { border-left-color: var(--warn); }
  .probe.fail { border-left-color: var(--fail); }

  @media (max-width: 1220px) {
    .dashboard-grid {
      grid-template-columns: minmax(0, 1fr) 300px;
    }
    .action-row {
      grid-template-columns: 42px 42px minmax(0, 1fr) 94px 76px;
    }
    .action-row .action-cta,
    .action-row .row-actions {
      grid-column: 3 / -1;
      justify-self: stretch;
    }
  }

  @media (max-width: 940px) {
    .topbar {
      grid-template-columns: 1fr;
      gap: var(--space-3);
    }
    .wordmark { font-size: 26px; }
    .command-wrap { max-width: none; }
    .topbar-right { justify-content: flex-start; flex-wrap: wrap; }
    .dashboard-grid,
    .split,
    .assistant-layout,
    .grid-2,
    .grid-3,
    .probe-grid {
      grid-template-columns: 1fr;
    }
    .more-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .help-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 720px) {
    .app-shell {
      padding: 0;
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
      background: var(--bg);
    }

    .app-frame {
      min-height: 100vh;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: var(--bg);
    }

    .topbar {
      min-height: auto;
      padding: calc(12px + env(safe-area-inset-top)) 14px 10px;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--border);
    }

    .wordmark {
      display: none;
    }

    .command-wrap {
      display: none;
    }

    .topbar-right {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      gap: 8px;
      width: 100%;
      align-items: center;
    }

    .topbar-right .operator {
      display: none;
    }

    .chip {
      height: 32px;
      padding: 0 10px;
      font-size: 12px;
    }

    .mobile-more-trigger {
      display: inline-flex;
      justify-self: end;
    }

    .primary-tabs {
      display: none;
    }

    .content {
      padding: 12px;
    }

    .panel-header {
      padding: 14px 14px 10px;
    }

    .panel-body {
      padding: 14px;
    }

    .action-row {
      grid-template-columns: 34px 34px minmax(0, 1fr);
      gap: 10px;
      min-height: 108px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      background: var(--surface);
      box-shadow: var(--shadow-1);
    }

    .action-row:last-child {
      border-bottom: 1px solid var(--border);
    }

    .action-row .metric-cell {
      grid-column: 3 / -1;
      display: flex;
      gap: 16px;
    }

    .action-row .action-cta {
      grid-column: 1 / -1;
      width: 100%;
    }

    .action-row .action-cta .btn {
      width: 100%;
    }

    .money-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .drawer {
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: auto;
      border: 0;
      border-radius: 0;
      transform: translateY(100%);
    }

    .drawer.open {
      transform: translateY(0);
    }

    .drawer-head {
      padding-top: calc(14px + env(safe-area-inset-top));
    }

    .drawer-footer {
      display: block;
      height: env(safe-area-inset-bottom);
    }

    .bottom-sheet {
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 18px 18px 0 0;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      max-height: 86vh;
    }

    .mobile-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      min-height: calc(64px + env(safe-area-inset-bottom));
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      border-top: 1px solid var(--border);
      box-shadow: var(--mobile-nav-shadow);
      backdrop-filter: blur(16px);
    }

    .mobile-nav button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 760;
      min-height: 52px;
      cursor: pointer;
      border-radius: var(--radius-sm);
    }

    .mobile-nav button.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .mobile-nav svg {
      width: 21px;
      height: 21px;
    }

    .toast {
      left: 12px;
      right: 12px;
      bottom: calc(80px + env(safe-area-inset-bottom));
      max-width: none;
    }

    .more-grid {
      grid-template-columns: 1fr;
    }

    .event-row {
      grid-template-columns: 46px 22px minmax(0, 1fr);
    }

    .event-row .event-summary {
      grid-column: 3;
    }

    table {
      min-width: 640px;
    }
  }
</style>
</head>
<body>
<div id="tokenScreen" class="login-wrap">
  <form class="login-card" onsubmit="login(event)">
    <div class="login-brand">CallMeIE</div>
    <h1>Admin access</h1>
    <p>Paste the owner token once. It will be stored locally and stripped from the URL on first load.</p>
    <label class="form-label" for="tokenInput">ADMIN_TOKEN</label>
    <input id="tokenInput" class="input mono" type="password" autocomplete="current-password" placeholder="Paste token">
    <button class="btn primary" type="submit">Open dashboard</button>
  </form>
</div>

<main id="main" class="app-shell" hidden>
  <section class="app-frame">
    <header class="topbar">
      <div class="wordmark">CallMeIE</div>
      <div class="command-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.2-4.2M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="globalSearch" class="command-input" type="search" placeholder="Search or type a command...">
        <span class="kbd">⌘K</span>
      </div>
      <div class="topbar-right">
        <button id="healthChip" class="chip ok" type="button" onclick="toggleHealthDetail()" title="Toggle health detail">
          <span class="status-dot"></span>
          <span id="healthLabel">Systems healthy</span>
        </button>
        <button id="moneyChip" class="chip money-chip" type="button" onclick="navigate('books')">
          <span>Today net</span>
          <strong id="netToday">€0.00</strong>
        </button>
        <button class="btn icon-btn mobile-more-trigger" type="button" onclick="openMoreSheet()" aria-label="More">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="operator" type="button" onclick="openMoreSheet()" aria-label="Open more tools">
          <div class="avatar">AD</div>
          <div>
            <div class="operator-name">Adam</div>
            <div class="operator-role">Operator</div>
          </div>
          <svg class="icon muted" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <nav class="primary-tabs" aria-label="Primary">
      <button class="tab-btn active" data-tab="today" onclick="navigate('today')"></button>
      <button class="tab-btn" data-tab="leads" onclick="navigate('leads')"></button>
      <button class="tab-btn" data-tab="calls" onclick="navigate('calls')"></button>
      <button class="tab-btn" data-tab="books" onclick="navigate('books')"></button>
    </nav>

    <section class="content">
      <div id="healthDetail" class="health-detail"></div>
      <section id="todayView" class="view active"></section>
      <section id="leadsView" class="view"></section>
      <section id="callsView" class="view"></section>
      <section id="booksView" class="view"></section>
      <section id="moreView" class="view"></section>
    </section>
  </section>
</main>

<nav id="mobileNav" class="mobile-nav" aria-label="Mobile primary">
  <button data-tab="today" class="active" type="button" onclick="navigate('today')"></button>
  <button data-tab="leads" type="button" onclick="navigate('leads')"></button>
  <button data-tab="calls" type="button" onclick="navigate('calls')"></button>
  <button data-tab="books" type="button" onclick="navigate('books')"></button>
  <button type="button" onclick="openMoreSheet()"><span data-icon="more"></span><span>More</span></button>
</nav>

<div id="drawerBackdrop" class="drawer-backdrop" onclick="closeDrawer()"></div>
<aside id="actionDrawer" class="drawer" aria-label="Lead workspace" aria-hidden="true">
  <div id="drawerContent"></div>
  <div class="drawer-footer"></div>
</aside>

<div id="sheetBackdrop" class="sheet-backdrop" onclick="closeMoreSheet()"></div>
<aside id="moreSheet" class="bottom-sheet" aria-label="More tools" aria-hidden="true">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div>
      <h2 class="panel-title">More</h2>
      <p class="panel-subtitle">Low-frequency operations stay reachable here.</p>
    </div>
    <button class="btn icon-btn" type="button" onclick="closeMoreSheet()" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="moreSheetBody" class="sheet-body"></div>
</aside>

<div id="modalBackdrop" class="modal-backdrop" onclick="closeModal()"></div>
<section id="helpModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="modal-head">
    <div>
      <h2 id="helpTitle" class="panel-title">Keyboard help</h2>
      <p class="panel-subtitle">Fast paths for the operator console.</p>
    </div>
    <button class="btn icon-btn" type="button" onclick="closeModal()" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="helpBody" class="modal-body"></div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  const BASE = window.location.origin;
  const TITLE_BASE = "CallMeIE Admin";
  const STORAGE_TOKEN = "admin_token";
  const STORAGE_THEME = "admin_theme";
  const PRIMARY_TABS = ["today", "leads", "calls", "books"];
  const MORE_ITEMS = [
    ["queue", "Queue", "Pending submissions", "queue"],
    ["recordings", "Recordings", "Mirrored call audio", "record"],
    ["errors", "Errors", "Vendor issue feed", "warning"],
    ["assistants", "Assistants", "Prompt and voice editor", "sliders"],
    ["flow", "Flow", "Assistant routing graph", "flow"],
    ["clients", "Active clients", "Provisioned businesses", "users"],
    ["discovery", "Discovery", "Quiz submissions", "search"],
    ["ads", "Ads", "Meta campaign control", "spark"],
    ["inbox", "Inbox", "Unified lead stream", "inbox"],
    ["voices", "Voice Samples", "TTS voiceover A/B", "record"],
    ["settings", "Settings", "Theme, tokens, exports", "settings"],
  ];

  const state = {
    token: "",
    currentTab: "today",
    currentMore: "",
    health: null,
    ops: null,
    events: [],
    actions: [],
    recordings: [],
    stripe: null,
    healthTimer: null,
    todayTimer: null,
    callsTimer: null,
    leadsCursor: null,
    assistantId: "",
    toastTimer: null,
    themeMode: "auto",
  };

  const qs = (sel, root = document) => root.querySelector(sel);
  const qsa = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  function icon(name, cls = "icon") {
    const p = {
      today: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.5"/>',
      leads: '<path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/>',
      calls: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7A2 2 0 0 1 22 16.9Z"/>',
      books: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/><path d="M9 7h7M9 11h5"/>',
      studio: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.2 7.2l-7 7a2.1 2.1 0 0 1-3-3l7-7a6 6 0 0 1 7.2-7.2l-3.8 3.8Z"/>',
      more: '<path d="M5 7h14M5 12h14M5 17h14"/>',
      queue: '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
      record: '<circle cx="12" cy="12" r="9"/><path d="M9 9v6l6-3-6-3Z"/>',
      warning: '<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v4M12 17h.01"/>',
      sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M2 14h4M10 8h4M18 16h4"/>',
      flow: '<rect x="3" y="4" width="6" height="6" rx="2"/><rect x="15" y="4" width="6" height="6" rx="2"/><rect x="9" y="16" width="6" height="6" rx="2"/><path d="M9 7h6M12 10v6"/>',
      users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
      search: '<path d="m21 21-4.2-4.2M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z"/>',
      spark: '<path d="m13 2-2 8H5l5 3-2 9 7-11h5l-7-9Z"/>',
      inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-7l3.5-7Z"/>',
      settings: '<path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4.2 17l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 1 1 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
      send: '<path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/>',
      close: '<path d="m6 6 12 12M18 6 6 18"/>',
      copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><rect x="2" y="2" width="13" height="13" rx="2"/>',
      phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7A2 2 0 0 1 22 16.9Z"/>',
      chevron: '<path d="m6 9 6 6 6-6"/>',
      download: '<path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>',
      refresh: '<path d="M21 12a9 9 0 0 0-15.3-6.4L3 8"/><path d="M3 3v5h5M3 12a9 9 0 0 0 15.3 6.4L21 16"/><path d="M21 21v-5h-5"/>',
      external: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/>',
    }[name] || '<circle cx="12" cy="12" r="8"/>';
    return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  }

  function installStaticIcons() {
    qsa("[data-tab]").forEach((btn) => {
      const tab = btn.dataset.tab;
      const label = tab === "books" ? "Books" : title(tab);
      btn.innerHTML = `${icon(tab)}<span>${label}</span>`;
    });
    qsa("[data-icon]").forEach((el) => {
      el.innerHTML = icon(el.dataset.icon);
    });
  }

  function login(event) {
    if (event) event.preventDefault();
    const input = qs("#tokenInput");
    const token = input.value.trim();
    if (!token) return;
    state.token = token;
    localStorage.setItem(STORAGE_TOKEN, token);
    startApp();
  }

  window.login = login;

  function logout() {
    localStorage.removeItem(STORAGE_TOKEN);
    sessionStorage.removeItem(STORAGE_TOKEN);
    state.token = "";
    window.location.href = "/admin";
  }

  window.logout = logout;

  function init() {
    installStaticIcons();
    initTheme();
    renderMoreSheet();
    renderHelp();
    const params = new URLSearchParams(window.location.search);
    const urlToken = params.get("token");
    const saved = urlToken || localStorage.getItem(STORAGE_TOKEN) || sessionStorage.getItem(STORAGE_TOKEN) || "";
    if (urlToken) {
      localStorage.setItem(STORAGE_TOKEN, urlToken);
      history.replaceState({}, TITLE_BASE, window.location.pathname);
    }
    if (saved) {
      state.token = saved;
      startApp();
    }
    qs("#tokenInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") login(event);
    });
    qs("#globalSearch").addEventListener("keydown", (event) => {
      if (event.key === "Enter") runCommandSearch(event.currentTarget.value);
    });
    document.addEventListener("keydown", handleKeys);
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        if (state.themeMode === "auto") applyTheme("auto");
      });
    }
  }

  function startApp() {
    qs("#tokenScreen").hidden = true;
    qs("#main").hidden = false;
    loadChrome();
    navigate("today");
    clearInterval(state.healthTimer);
    clearInterval(state.todayTimer);
    state.healthTimer = setInterval(loadChrome, 30000);
    state.todayTimer = setInterval(() => {
      if (state.currentTab === "today") loadToday();
    }, 45000);
  }

  function endpoint(path, params = {}) {
    const url = new URL(path, BASE || window.location.href);
    url.searchParams.set("token", state.token);
    Object.entries(params).forEach(([key, value]) => {
      if (value !== undefined && value !== null && value !== "") url.searchParams.set(key, value);
    });
    return url.toString();
  }

  async function api(path, options = {}) {
    const { params, ...fetchOptions } = options;
    const res = await fetch(endpoint(path, params), fetchOptions);
    let data = null;
    const text = await res.text();
    if (text) {
      try { data = JSON.parse(text); }
      catch { data = { raw: text }; }
    }
    if (!res.ok) {
      const err = new Error((data && (data.detail || data.error || data.message)) || `HTTP ${res.status}`);
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  function title(s) {
    return String(s || "").replace(/[-_]/g, " ").replace(/\b\w/g, (m) => m.toUpperCase());
  }

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    }[c]));
  }

  function eur(minor, currency = "eur") {
    const value = Number(minor || 0) / 100;
    const code = String(currency || "eur").toUpperCase();
    try {
      return new Intl.NumberFormat("en-IE", { style: "currency", currency: code }).format(value);
    } catch {
      return `€${value.toFixed(2)}`;
    }
  }

  function moneyFromAmount(amount, currency = "eur") {
    return eur(amount, currency);
  }

  function fmtTime(value) {
    if (!value) return "now";
    const raw = String(value);
    const normal = raw.includes("T") ? raw : raw.replace(" ", "T");
    const date = new Date(normal.endsWith("Z") || /[+-]\d\d:\d\d$/.test(normal) ? normal : `${normal}Z`);
    if (Number.isNaN(date.getTime())) return raw.slice(11, 16) || raw;
    return date.toLocaleTimeString("en-IE", { hour: "2-digit", minute: "2-digit" });
  }

  function fmtDate(value) {
    if (!value) return "";
    const raw = String(value);
    if (/^\d+$/.test(raw)) {
      return new Date(Number(raw) * 1000).toLocaleString("en-IE", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
    }
    const normal = raw.includes("T") ? raw : raw.replace(" ", "T");
    const date = new Date(normal.endsWith("Z") || /[+-]\d\d:\d\d$/.test(normal) ? normal : `${normal}Z`);
    if (Number.isNaN(date.getTime())) return raw;
    return date.toLocaleString("en-IE", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  }

  function initials(name, business) {
    const text = `${name || ""} ${business || ""}`.trim();
    if (!text) return "AD";
    return text.split(/\s+/).filter(Boolean).slice(0, 2).map((x) => x[0]).join("").toUpperCase();
  }

  function heatClass(heat, stateName = "") {
    const h = String(heat || stateName || "").toLowerCase();
    if (h.includes("very") || h.includes("hot")) return "hot";
    if (h.includes("curious") || h.includes("warm") || h.includes("submission")) return "warm";
    if (h.includes("fail") || h.includes("error")) return "fail";
    return "cold";
  }

  function heatLabel(heat, stateName = "") {
    const cls = heatClass(heat, stateName);
    if (cls === "hot") return "HOT";
    if (cls === "warm") return "WARM";
    if (cls === "fail") return "FAIL";
    return "COLD";
  }

  function stateCopy(stateName) {
    const map = {
      demo_complete_hot: ["Demo complete", "Ready to send setup link"],
      demo_complete_warm: ["Warm demo", "Review then call back"],
      demo_complete_browsing: ["Demo complete", "Low-intent review"],
      recording_ready_no_demo: ["Recording ready", "Review before callback"],
      submission_pending: ["Onboarding pending", "Provision assistant"],
      stripe_session_open: ["Payment in flight", "Resend payment link"],
      system_fault: ["System fault", "Check vendor probes"],
      whatsapp_unread: ["WhatsApp unread", "Reply to lead"],
    };
    return map[stateName] || [title(stateName || "Action"), "Review context"];
  }

  function setLoading(el, copy = "Loading...") {
    el.innerHTML = `<div class="empty">${esc(copy)}</div>`;
  }

  function showToast(message, type = "success") {
    const toast = qs("#toast");
    toast.textContent = message;
    toast.className = `toast ${type} show`;
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 3600);
  }

  function navigate(tab, more = "") {
    if (!state.token && !qs("#main").hidden) return;
    clearInterval(state.callsTimer);
    state.callsTimer = null;
    state.currentTab = tab;
    state.currentMore = more;
    qsa(".tab-btn").forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === tab));
    qsa("#mobileNav [data-tab]").forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === tab));
    qsa(".view").forEach((view) => view.classList.remove("active"));
    const view = qs(`#${tab}View`) || qs("#moreView");
    view.classList.add("active");
    if (tab === "today") loadToday();
    if (tab === "leads") loadLeads();
    if (tab === "calls") {
      loadCalls();
      state.callsTimer = setInterval(loadCalls, 5000);
    }
    if (tab === "books") loadBooks();
    if (tab === "more") loadMore(more || "settings");
    closeMoreSheet();
  }

  window.navigate = navigate;

  function reloadCurrent() {
    if (state.currentTab === "more") return loadMore(state.currentMore || "settings");
    navigate(state.currentTab);
    loadChrome();
  }

  function runCommandSearch(value) {
    const q = String(value || "").trim();
    if (!q) return;
    if (/lead/i.test(q)) navigate("leads");
    else if (/call|record/i.test(q)) navigate("calls");
    else if (/book|stripe|revenue|money/i.test(q)) navigate("books");
    else if (/setting|theme|token/i.test(q)) navigate("more", "settings");
    else navigate("leads");
    showToast(`Searching for "${q}"`);
  }

  async function loadChrome() {
    await Promise.allSettled([loadHealth(), loadOperationsSummary()]);
  }

  async function loadOperationsSummary() {
    try {
      const data = await api("/admin/api/operations-summary");
      state.ops = data;
      const today = data.today || {};
      const net = Number(today.net_minor || 0) - Number(today.vapi_cost_minor || 0);
      qs("#netToday").textContent = eur(net, data.currency || "eur");
      return data;
    } catch (err) {
      qs("#netToday").textContent = "offline";
      return null;
    }
  }

  async function loadHealth() {
    try {
      const data = await api("/admin/api/health-detail");
      state.health = data;
      const status = normalStatus(data.overall);
      const chip = qs("#healthChip");
      chip.className = `chip ${status}`;
      qs("#healthLabel").textContent = status === "ok" ? "Systems healthy" : status === "warn" ? "Needs attention" : "Systems failing";
      setFavicon(status);
      updateThemeColor();
      if (qs("#healthDetail").classList.contains("open")) renderHealthDetail(data);
      return data;
    } catch (err) {
      const chip = qs("#healthChip");
      chip.className = "chip warn";
      qs("#healthLabel").textContent = "Health unknown";
      setFavicon("warn");
      return null;
    }
  }

  function normalStatus(status) {
    const s = String(status || "").toLowerCase();
    if (s === "ok" || s === "healthy") return "ok";
    if (s === "fail" || s === "error" || s === "critical") return "fail";
    return "warn";
  }

  function setFavicon(status) {
    const color = status === "fail" ? "crimson" : status === "warn" ? "goldenrod" : "seagreen";
    const prefix = status === "fail" ? "● " : status === "warn" ? "⚠ " : "";
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="${color}"/></svg>`;
    let link = document.querySelector('link[rel="icon"]');
    if (!link) {
      link = document.createElement("link");
      link.rel = "icon";
      document.head.appendChild(link);
    }
    link.type = "image/svg+xml";
    link.href = `data:image/svg+xml;base64,${btoa(svg)}`;
    document.title = `${prefix}${TITLE_BASE}`;
  }

  function updateThemeColor() {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (!meta) return;
    const color = getComputedStyle(document.documentElement).getPropertyValue("--surface").trim();
    meta.setAttribute("content", color || "Canvas");
  }

  function toggleHealthDetail() {
    const box = qs("#healthDetail");
    box.classList.toggle("open");
    if (box.classList.contains("open")) renderHealthDetail(state.health);
  }

  window.toggleHealthDetail = toggleHealthDetail;

  function renderHealthDetail(data) {
    const probes = (data && data.probes) || [];
    qs("#healthDetail").innerHTML = `
      <div class="panel pad">
        <div class="view-title-row">
          <div>
            <h1>System pulse</h1>
            <p>${esc(probes.length)} probes checked ${esc(data && data.ts ? fmtDate(data.ts) : "")}</p>
          </div>
          <div class="panel-actions">
            <button class="btn" type="button" onclick="loadTwilioNumbersIntoHealth()">${icon("phone")}Twilio numbers</button>
            <button id="redeployQuickBtn" class="btn" type="button" onclick="coolifyRedeploy('redeployQuickBtn')">${icon("refresh")}Redeploy</button>
          </div>
        </div>
        <div class="probe-grid">
          ${probes.map((probe) => `
            <div class="probe ${normalStatus(probe.status)}">

  async function loadToday() {
    const view = qs("#todayView");
    setLoading(view, "Ranking next best actions...");
    try {
      const [actionsRes, opsRes, healthRes, eventsRes, recRes] = await Promise.allSettled([

      ]);

      const health = valueOf(healthRes, null);
      const events = valueOf(eventsRes, []);

            ${renderRecordingsPanel(recordings)}

  function valueOf(settled, fallback) {

  function renderActionsPanel(data) {
    const actions = data.actions || [];

        <div class="panel-header">
          <div>
            <h1 class="panel-title">Next best actions</h1>
            <p class="panel-subtitle">Ranked by urgency and value</p>
          </div>
          <button class="btn ghost" type="button" onclick="navigate('more','queue')">View all actions (${esc(actions.length || 0)})</button>
        </div>
        <div class="action-list">
          ${actions.length ? actions.map((action, index) => renderActionRow(action, index)).join("") : `
            <div class="empty">No urgent actions. New calls, submissions, or open payment sessions will appear here.</div>
          `}
        </div>
      </section>`;
  }

  function actionContext(action) {
    const subject = action.subject || {};
    const context = action.context || {};
    const stateInfo = stateCopy(action.state);
    return {
      name: subject.name || subject.business || "?",
      business: subject.business || "",
      phone: subject.phone || "",
      email: subject.email || "",
      state: action.state || "",
      heat: action.heat || "",
      label: action.suggested_action_label || stateInfo[1],
      summary: context.summary || "",
      call_id: context.call_id || "",
      tier: context.tier_hint || "professional",
      session_id: context.session_id || "",
      submission_id: context.submission_id || "",
      last_event_at: context.last_event_at || "",
      rank_score: action.rank_score || 0,
      estimated_value_minor: context.estimated_value_minor || (context.tier_hint === "growth" ? 39700 : 24900),

  }

  function renderActionRow(action, index) {
    const ctx = actionContext(action);
    const cls = heatClass(ctx.heat, ctx.state);
    const [stateTitle, stateSub] = stateCopy(ctx.state);
    // Every action row gets the quick-classify buttons. Fallback to a
    // synthetic flag ID so submission / stripe / system-fault / whatsapp
    // rows (no call_id) still classify cleanly into call-flagged log.
    const flagId = ctx.call_id
                || (ctx.submission_id ? `submission:${ctx.submission_id}` : null)
                || (ctx.session_id    ? `stripe:${ctx.session_id}`        : null)
                || (ctx.state         ? `state:${ctx.state}:${ctx.name || "?"}:${ctx.last_event_at || ""}` : null);
    return `
      <article class="action-row" role="button" tabindex="0" onclick='openDrawer(${jsonAttr(ctx)})' onkeydown='rowKeyOpen(event, ${jsonAttr(ctx)})'>
        <div class="rank ${cls}">${index + 1}</div>
        <div class="initials">${esc(initials(ctx.name, ctx.business))}</div>
        <div class="truncate">
          <div class="row-title"><span>${esc(ctx.name)} · ${esc(ctx.business || "unknown")}</span><span class="badge ${cls}">${heatLabel(ctx.heat, ctx.state)}</span></div>
          <div class="row-sub">${esc(stateTitle)} · ${esc(stateSub)}${ctx.phone ? ` · ${esc(ctx.phone)}` : ""}</div>
        </div>
        <div class="metric-cell"><span>Est. value</span><strong>${eur(ctx.estimated_value_minor)}</strong><span>+ setup</span></div>
        <div class="metric-cell"><span>${esc(relativeTime(ctx.last_event_at))}</span><strong>${esc(ctx.call_id ? "Last event" : "Submitted")}</strong></div>
        <div class="row-actions">
          ${flagId ? renderFlagButtons(flagId, { compact: true }) : ""}
          <button class="btn primary" type="button" onclick='event.stopPropagation(); openDrawer(${jsonAttr(ctx)})'>${icon(ctx.state === "submission_pending" ? "leads" : "send")} ${esc(ctx.label)}</button>

      </article>`;
  }

  // === Classification (Real / Test / Spam / Discard) =====================
  function renderFlagButtons(callId, opts) {
    opts = opts || {};
    const compact = !!opts.compact;
    const safe = esc(callId);
    const cls = compact ? "flag-btns compact" : "flag-btns";
    return `
      <div class="${cls}" onclick="event.stopPropagation()">
        <button class="btn ghost flag-btn flag-real" type="button" title="Mark as real lead" onclick="flagCall('${safe}','real',event)">${compact ? "✓" : "✓ Real"}</button>
        <button class="btn ghost flag-btn flag-test" type="button" title="Mark as test call" onclick="flagCall('${safe}','test',event)">${compact ? "🧪" : "🧪 Test"}</button>
        <button class="btn ghost flag-btn flag-spam" type="button" title="Flag as spam / robocall" onclick="flagCall('${safe}','spam',event)">${compact ? "🚫" : "🚫 Spam"}</button>
        <button class="btn ghost flag-btn flag-discard" type="button" title="Discard / not pursuing" onclick="flagCall('${safe}','discard',event)">${compact ? "✗" : "✗ Discard"}</button>
      </div>`;
  }

  async function flagCall(callId, classification, ev) {
    if (ev) { ev.preventDefault(); ev.stopPropagation(); }
    try {
      await api("/admin/api/call-flag", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ call_id: callId, classification }),
      });
      showToast(`Marked as ${classification}`);
      // Refresh the active tab so the row drops off where appropriate
      if (state.currentTab === "today") loadToday();
      else if (state.currentTab === "calls") loadCalls();
      else if (state.currentTab === "leads") loadLeads();
      if (qs("#drawerBackdrop")?.classList.contains("open")) closeDrawer();
    } catch (err) {
      showToast(err.message || "Flag failed", "error");
    }
  }

  window.flagCall = flagCall;

  window.rowKeyOpen = (event, ctx) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openDrawer(ctx);
    }
  };

  function jsonAttr(obj) {
    return esc(JSON.stringify(obj));
  }

  function relativeTime(value) {
    if (!value) return "Now";
    const raw = String(value);
    const normal = raw.includes("T") ? raw : raw.replace(" ", "T");
    const date = new Date(normal.endsWith("Z") || /[+-]\d\d:\d\d$/.test(normal) ? normal : `${normal}Z`);
    if (Number.isNaN(date.getTime())) return fmtTime(value);
    const mins = Math.max(0, Math.round((Date.now() - date.getTime()) / 60000));
    if (mins < 2) return "Now";
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.round(mins / 60);
    if (hours < 48) return `${hours}h ago`;
    return `${Math.round(hours / 24)}d ago`;
  }

  function renderMoneyPanel(ops) {

      <path d="M4 58 C18 46 22 52 31 38 S48 22 57 31 74 14 85 20 97 34 108 24 124 27 136 16 V68 H4Z" fill="currentColor" opacity=".08"/>

  function renderSystemPanel(health) {
    const probes = (health && health.probes) || [];
    // No fake-green fallback. If health-detail returned no probes, surface that
    // as "Status unknown" — Adam knows to click Errors to investigate rather
    // than seeing four ✓s during an actual outage.
    if (!probes.length) {
      return `
        <section class="panel">
          <div class="panel-header">
            <div>
              <h2 class="panel-title">System pulse</h2>
              <p class="panel-subtitle">Status unknown</p>
            </div>
            <span class="badge warn">?</span>
          </div>
          <div class="panel-body">
            <div class="soft-note warn-text">Health check did not return. Open the Errors view for the vendor feed, or hit Redeploy if the API is unreachable.</div>
          </div>
        </section>`;
    }
    const bad = probes.filter((p) => normalStatus(p.status) !== "ok");
    return `
      <section class="panel">
        <div class="panel-header">
          <div>
            <h2 class="panel-title">System pulse</h2>
            <p class="panel-subtitle">${bad.length ? "Needs attention" : "All systems operational"}</p>

            </div>
          `).join("")}

  function renderMiniEvent(ev) {
    return `
      <div class="mini-row">

        <span class="time">${esc(fmtTime(ev.created_at || ev.ts))}</span>
        <span class="truncate"><strong>${esc(eventIdentity(ev))}</strong><br><span class="muted">${esc(eventSummary(ev))}</span></span>
        <span class="muted">${esc(relativeTime(ev.created_at || ev.ts))}</span>

  function eventIcon(type) {
    const t = String(type || "");
    if (t.includes("lead")) return "leads";
    if (t.includes("demo")) return "today";
    if (t.includes("call")) return "calls";
    if (t.includes("checkout") || t.includes("stripe")) return "books";

  function eventIdentity(ev) {
    const detail = parseDetail(ev.detail);
    return detail.name || detail.business_name || detail.business_type || ev.assistant || ev.call_id || "Call event";
  }

  function eventSummary(ev) {
    return ev.summary || ev.event_type || "event";
  }

  function parseDetail(detail) {
    if (!detail) return {};
    if (typeof detail === "object") return detail;
    try { return JSON.parse(detail); }
    catch { return {}; }
  }

  function renderCallGroups(events, scoring) {
    const groups = new Map();
    for (const ev of events || []) {
      const id = ev.call_id || "uncategorised";
      if (!groups.has(id)) groups.set(id, []);
      groups.get(id).push(ev);
    }
    const rows = Array.from(groups.entries()).slice(0, 60);
    if (!rows.length) return '<div class="empty">No call events returned.</div>';
    return rows.map(([callId, evs]) => renderCallGroup(callId, evs, scoring)).join("");

  // 2026-05-13 — Call Log filter chip click handler + filtered renderer.
  // Three modes: 'all' / 'hot' / 'no-hangups'.
  window.setCallFilter = function(mode) {
    state.callFilter = mode;
    const scoring = state.scoring || (state.events || []).reduce((a,e)=>a, {});
    const timeline = document.getElementById('callTimeline');
    if (timeline) {
      timeline.innerHTML = renderFilteredCallGroups(state.events || [], scoring, mode);
    }
    document.querySelectorAll('.filter-chip').forEach(b => {
      b.classList.toggle('active', b.dataset && b.dataset.filter === mode);
    });
    const counter = document.getElementById('callEventsCount');
    if (counter) {
      const filt = filteredCallGroups(state.events || [], scoring, mode);
      counter.textContent = `${filt.flatCount} events`;
    }
  };

  function filteredCallGroups(events, scoring, mode) {
    const groups = new Map();
    for (const ev of events || []) {
      const id = ev.call_id || "uncategorised";
      if (!groups.has(id)) groups.set(id, []);
      groups.get(id).push(ev);
    }
    let entries = Array.from(groups.entries());
    if (mode === 'hot') {
      entries = entries.filter(([cid, evs]) => heatClass(callHeat(evs, scoring, cid)) === 'hot');
    } else if (mode === 'no-hangups') {
      // Drop groups whose only event_type is 'call-ended' (= hang-up / no signal)
      entries = entries.filter(([cid, evs]) => {
        const types = new Set(evs.map(e => e.event_type));
        return !(types.size === 1 && types.has('call-ended'));
      });
    }
    let flatCount = 0;
    for (const [, evs] of entries) flatCount += evs.length;
    return { entries, flatCount };
  }

  function renderFilteredCallGroups(events, scoring, mode) {
    const { entries } = filteredCallGroups(events, scoring, mode);
    const rows = entries.slice(0, 60);
    if (!rows.length) return '<div class="empty">No matching calls.</div>';
    return rows.map(([callId, evs]) => renderCallGroup(callId, evs, scoring)).join("");
  }

  function renderCallGroup(callId, events, scoring) {
    const oldest = [...events].reverse();
    const identity = callIdentity(events);
    const heat = callHeat(events, scoring, callId);
    const ctx = {
      name: identity.name,
      business: identity.business,
      phone: identity.phone,
      heat,
      state: heatClass(heat) === "hot" ? "demo_complete_hot" : "call_log",
      label: heatClass(heat) === "hot" ? "Send setup link" : "Review call",
      call_id: callId === "uncategorised" ? "" : callId,
      tier: "professional",
      last_event_at: events[0] && events[0].created_at,
    };
    return `
      <article class="call-group">
        <header class="call-head" onclick='openDrawer(${jsonAttr(ctx)})'>
          <div class="truncate">
            <div class="row-title"><span>${esc(identity.name)} · ${esc(identity.business || "call")}</span><span class="badge ${heatClass(heat)}">${heatLabel(heat)}</span></div>
            <div class="row-sub mono">${esc(callId)} · ${events.length} events</div>
          </div>
          <span class="muted">${esc(relativeTime(events[0] && events[0].created_at))}</span>
        </header>
        ${oldest.map((ev) => `
          <div class="event-row">
            <span class="time">${esc(fmtTime(ev.created_at))}</span>
            <span class="timeline-dot">${icon(eventIcon(ev.event_type), "icon")}</span>
            <span><span class="badge">${esc(ev.event_type || "event")}</span><br><span class="muted">${esc(ev.assistant || "")}</span></span>
            <span class="event-summary">${esc(ev.summary || detailSummary(ev.detail))}</span>
          </div>
        `).join("")}
      </article>`;
  }

  function callIdentity(events) {
    for (const ev of [...events].reverse()) {
      const d = parseDetail(ev.detail);
      if (d.name || d.business_type || d.contact_phone || d.phone) {
        return {
          name: d.name || d.business_name || "Caller",
          business: d.business_type || d.business || ev.assistant || "",
          phone: d.contact_phone || d.phone || "",
        };
      }
    }
    return { name: "Caller", business: events[0] && events[0].assistant, phone: "" };
  }

  function callHeat(events, scoring, callId) {
    const scoreRows = scoring && (scoring.calls || scoring.scores || scoring.data || []);
    if (Array.isArray(scoreRows)) {
      const row = scoreRows.find((x) => x.call_id === callId);
      if (row && (row.heat || row.interest_level)) return row.heat || row.interest_level;
    }
    for (const ev of events || []) {
      const d = parseDetail(ev.detail);
      if (d.interest_level) return d.interest_level;
    }
    return "unknown";
  }

  function detailSummary(detail) {
    const d = parseDetail(detail);
    return d.summary || d.next_action || d.business_type || "";

  async function loadDrawerData(ctx) {
    const timelineEl = qs("#drawerTimeline");
    const recEl = qs("#drawerRecording");
    const stripeEl = qs("#drawerStripe");
    if (ctx.call_id) {
      try {
        const data = await api(`/admin/api/caller/${encodeURIComponent(ctx.call_id)}`);
        const events = data.events || [];
        timelineEl.innerHTML = `<h3>Timeline</h3>${renderTimeline(events)}`;
        // 2026-05-13 — transcript render. Pulled from call-ended event's
        // detail.transcript (added server-side in commit d096d4d). Falls back
        // to detail.summary / detail.messages summary if no transcript.
        const trEl = qs("#drawerTranscript");
        if (trEl) {
          let transcript = "";
          let analysisSummary = "";
          let endedReason = "";
          for (const ev of events) {
            const d = ev.detail || {};
            if (d.transcript && !transcript) transcript = d.transcript;
            if (d.summary && !analysisSummary) analysisSummary = d.summary;
            if (d.ended_reason && !endedReason) endedReason = d.ended_reason;
          }
          let html = "<h3>Transcript</h3>";
          if (transcript) {
            // 2026-05-13 — STT disclaimer + AI-confirm callout
            html += `<div style="background:rgba(255,200,80,0.10);border-left:3px solid rgba(255,180,40,0.7);padding:8px 10px;border-radius:4px;font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.4;"><strong>Transcription note:</strong> automated transcription may render some words incorrectly. The AI confirms sensitive or routing-critical data (name, business, callback number, reason) with the caller before saving or transferring.</div>`;
          }
          if (analysisSummary) {
            html += `<p class="muted" style="margin-bottom:10px;"><strong>Summary:</strong> ${esc(analysisSummary)}</p>`;
          }
          if (endedReason) {
            html += `<p class="muted" style="font-size:11px;margin-bottom:6px;">Ended: ${esc(endedReason)}</p>`;
          }
          if (transcript) {
            html += `<pre style="white-space:pre-wrap;word-break:break-word;background:rgba(255,255,255,0.03);padding:10px;border-radius:6px;font-size:12px;max-height:400px;overflow:auto;">${esc(transcript)}</pre>`;
          } else {
            html += `<div class="empty">No transcript stored for this call. (Pre-2026-05-13 calls did not capture transcripts. New calls will. Old call data can be backfilled via Vapi GET /v1/call/{id} if needed.)</div>`;
          }
          // Notes list (saved notes)
          const notes = (data.notes || []);
          html += `<h3 style="margin-top:14px;">Notes</h3>`;
          if (notes.length) {
            html += notes.map(n => `<div style="background:rgba(255,255,255,0.04);padding:8px 10px;border-radius:4px;margin-bottom:6px;font-size:12px;"><div class="mono muted" style="font-size:10px;margin-bottom:3px;">${esc((n.ts||'').slice(0,19))} · ${esc(n.actor||'')}${n.tenant_slug?(' · '+esc(n.tenant_slug)):''}</div><div style="white-space:pre-wrap;">${esc(n.note||'')}</div></div>`).join("");
          } else {
            html += `<div class="empty" style="font-size:11px;">No notes saved yet.</div>`;
          }
          trEl.innerHTML = html;
        }
      } catch (err) {
        timelineEl.innerHTML = `<h3>Timeline</h3><div class="empty">${esc(err.message)}</div>`;
        const trEl = qs("#drawerTranscript");
        if (trEl) trEl.innerHTML = `<h3>Transcript</h3><div class="empty">${esc(err.message)}</div>`;
      }
      try {
        const recs = await loadRecordingsData(100);
        const rec = recs.find((r) => r.call_id === ctx.call_id);
        recEl.innerHTML = `<h3>Recording</h3>${rec ? renderAudio(rec) : '<div class="empty">No recording mirrored yet.</div>'}`;
      } catch (err) {
        recEl.innerHTML = `<h3>Recording</h3><div class="empty">${esc(err.message)}</div>`;
      }
    } else {
      timelineEl.innerHTML = '<h3>Timeline</h3><div class="empty">No call timeline for this action.</div>';
      recEl.innerHTML = ctx.recording_url ? `<h3>Recording</h3>${renderAudio(ctx)}` : '<h3>Recording</h3><div class="empty">No recording attached.</div>';
    }
    try {
      const stripe = state.stripe || await api("/admin/api/stripe-recent");
      state.stripe = stripe;
      const session = findSession(stripe.sessions || [], ctx);
