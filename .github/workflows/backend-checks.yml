name: Backend checks

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-offline:
    name: backend-offline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: Check runtime and CI lock alignment
        run: python check_ci_runtime_lock.py
      - name: Install hash-locked dependencies
        env:
          PIP_CONFIG_FILE: /dev/null
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Run complete offline backend suite
        run: |
          mkdir -p "$RUNNER_TEMP/backend-ci/home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/backend-ci/home" \
            TMPDIR="$RUNNER_TEMP/backend-ci" PYTHONUTF8=1 PYTHONPATH="$PWD/tests" \
            PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            AWS_EC2_METADATA_DISABLED=true \
            DB_PATH="$RUNNER_TEMP/backend-ci/callmeie.sqlite" \
            AGENCY_DB_PATH="$RUNNER_TEMP/backend-ci/agency.sqlite" \
            python -m pytest -p pytest_socket tests -m 'not integration' \
            --strict-markers --disable-socket --allow-unix-socket \
            --basetemp "$RUNNER_TEMP/backend-ci/pytest-temp" \
            --junitxml "$RUNNER_TEMP/backend-ci/pytest-results.xml" -q
      - name: Run existing imported-app fixture
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/backend-ci/home" \
            TMPDIR="$RUNNER_TEMP/backend-ci" PYTHONUTF8=1 \
            PYTHONDONTWRITEBYTECODE=1 AWS_EC2_METADATA_DISABLED=true \
            python tests/test_admin_release_integration.py \
            2>&1 | tee "$RUNNER_TEMP/backend-ci/imported-app-results.json"
      - name: Run existing JavaScript source tests
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/backend-ci/home" \
            TMPDIR="$RUNNER_TEMP/backend-ci" \
            node --test --test-reporter=tap tests/*.cjs 2>&1 | tee "$RUNNER_TEMP/backend-ci/javascript-results.tap"
      - name: Retain test result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-offline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/backend-ci/pytest-results.xml
            ${{ runner.temp }}/backend-ci/javascript-results.tap
            ${{ runner.temp }}/backend-ci/imported-app-results.json
          if-no-files-found: warn
          retention-days: 7
