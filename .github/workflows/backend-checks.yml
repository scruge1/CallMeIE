name: Backend checks

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-offline:
    name: backend-offline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: Install hash-locked dependencies
        env:
          PIP_CONFIG_FILE: /dev/null
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Run complete offline backend suite
        run: |
          mkdir -p "$RUNNER_TEMP/backend-ci/home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/backend-ci/home" \
            TMPDIR="$RUNNER_TEMP/backend-ci" PYTHONUTF8=1 \
            PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            AWS_EC2_METADATA_DISABLED=true \
            DB_PATH="$RUNNER_TEMP/backend-ci/callmeie.sqlite" \
            AGENCY_DB_PATH="$RUNNER_TEMP/backend-ci/agency.sqlite" \
            python -m pytest -p pytest_socket tests -m 'not integration' \
            --strict-markers --disable-socket --allow-unix-socket \
            --basetemp "$RUNNER_TEMP/backend-ci/pytest-temp" \
            --junitxml "$RUNNER_TEMP/backend-ci/pytest-results.xml" -q
      - name: Retain test result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-offline-${{ github.sha }}
          path: ${{ runner.temp }}/backend-ci/pytest-results.xml
          if-no-files-found: warn
          retention-days: 7
